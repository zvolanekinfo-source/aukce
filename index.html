<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iAukce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = "https://uwfpyjbvgyesxmpzedcs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_44EjLS-r5zu7hEVK6ZZO9A_a28zzo01";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const toYMD = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        const toHM = (date) => `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;

        function App() {
            const [user, setUser] = React.useState(() => {
                const saved = localStorage.getItem('iaukce_session');
                return saved ? JSON.parse(saved) : null;
            });
            const [isAdmin, setIsAdmin] = React.useState(() => {
                return localStorage.getItem('iaukce_auth') === 'true';
            });
            
            const [view, setView] = React.useState('home');
            const [selectedAuctionId, setSelectedAuctionId] = React.useState(null);
            const [selectedAdminAuction, setSelectedAdminAuction] = React.useState(null);

            const [footerVisible, setFooterVisible] = React.useState(true);
            const [showAdminLoginBox, setShowAdminLoginBox] = React.useState(false);
            const [showAuthMenu, setShowAuthMenu] = React.useState(false);

            const [regForm, setRegForm] = React.useState({ firstName: '', lastName: '', phone: '' });
            const [loginForm, setLoginForm] = React.useState({ lastName: '', phone: '' });
            
            const [adminUser, setAdminUser] = React.useState('');
            const [adminPassword, setAdminPassword] = React.useState('');
            const [adminLoginError, setAdminLoginError] = React.useState(false);

            const [now, setNow] = React.useState(Date.now());
            React.useEffect(() => {
                const interval = setInterval(() => setNow(Date.now()), 1000);
                return () => clearInterval(interval);
            }, []);

            const [auctions, setAuctions] = React.useState([]);
            const [participants, setParticipants] = React.useState([]);

            // Načtení dat ze Supabase
            const fetchData = async () => {
                try {
                    const { data: aucData, error: aucErr } = await supabase.from('auctions').select('*');
                    if (aucErr) console.error("Chyba aukcí:", aucErr);
                    if (aucData) {
                        const formattedAuctions = aucData.map(a => ({
                            id: a.id,
                            title: a.title || 'iPhone Aukce',
                            productName: a.product_name || a.productName || 'iPhone',
                            description: a.description || '',
                            imageUrl: a.image_url || a.imageUrl || '',
                            startPrice: Number(a.starting_price || a.start_price || a.startPrice || 1000),
                            minBidStep: Number(a.min_bid_step || a.minBidStep || 100),
                            autoExtendMinutes: Number(a.auto_extend_minutes || a.autoExtendMinutes || 0),
                            startTime: a.start_time || a.created_at || new Date().toISOString(),
                            endTime: a.ends_at || a.end_time || a.endTime || new Date(Date.now() + 86400000).toISOString(),
                            forceEnded: a.force_ended || (a.status === 'ended'),
                            bids: a.bids || []
                        }));
                        setAuctions(formattedAuctions);
                    }

                    const { data: partData, error: partErr } = await supabase.from('participants').select('*');
                    if (partErr) console.error("Chyba účastníků:", partErr);
                    if (partData) {
                        const formattedParticipants = partData.map(p => ({
                            id: p.id,
                            firstName: p.first_name || p.firstName || '',
                            lastName: p.last_name || p.lastName || '',
                            phone: p.phone || ''
                        }));
                        setParticipants(formattedParticipants);
                    }
                } catch (err) {
                    console.error("Chyba načítání:", err);
                }
            };

            // Živá synchronizace přes Supabase Realtime
            React.useEffect(() => {
                fetchData();

                const channel = supabase.channel('iaukce-realtime-all')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'auctions' }, () => fetchData())
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'participants' }, () => fetchData())
                    .subscribe();

                return () => {
                    supabase.removeChannel(channel);
                };
            }, []);

            const today = new Date();
            const tomorrow = new Date(Date.now() + 86400000);

            const [newAuction, setNewAuction] = React.useState({
                title: 'iPhone Aukce',
                productName: '',
                description: '',
                imageUrl: '',
                startPrice: 1000,
                minBidStep: 100,
                autoExtendMinutes: 2,
                startDate: toYMD(today),
                startTime: toHM(today),
                endDate: toYMD(tomorrow),
                endTime: toHM(tomorrow)
            });

            const [editingAuctionId, setEditingAuctionId] = React.useState(null);
            const [editForm, setEditForm] = React.useState({ 
                title: '', productName: '', description: '', imageUrl: '', 
                startPrice: 1000, minBidStep: 100, autoExtendMinutes: 2,
                startDate: '', startTime: '', endDate: '', endTime: '' 
            });

            const [customBidInput, setCustomBidInput] = React.useState('');
            const [sliderMultiplier, setSliderMultiplier] = React.useState(1);
            const [showConfirmModal, setShowConfirmModal] = React.useState(false);
            const [pendingBid, setPendingBid] = React.useState(0);
            const [showAllBidsModal, setShowAllBidsModal] = React.useState(false);

            React.useEffect(() => { 
                localStorage.setItem('iaukce_session', JSON.stringify(user)); 
            }, [user]);
            
            React.useEffect(() => { 
                localStorage.setItem('iaukce_auth', isAdmin); 
            }, [isAdmin]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                const targetPass = String.fromCharCode(64, 100, 109, 105, 110, 49);
                if (adminUser.trim() === 'Zvolanek1' && adminPassword === targetPass) {
                    setUser(null); setIsAdmin(true); setAdminLoginError(false); setView('admin'); setShowAuthMenu(false);
                } else { 
                    setAdminLoginError(true); 
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!regForm.firstName || !regForm.lastName || !regForm.phone) {
                    alert('Prosím vyplňte všechna pole.'); return;
                }
                const newUser = { id: String(Date.now()), first_name: regForm.firstName.trim(), last_name: regForm.lastName.trim(), phone: regForm.phone.trim() };
                
                await supabase.from('participants').insert([newUser]);

                const clientUser = { id: newUser.id, firstName: newUser.first_name, lastName: newUser.last_name, phone: newUser.phone };
                setIsAdmin(false); 
                setUser(clientUser);
                await fetchData();
                setView('home');
            };

            const handleLoginExisting = (e) => {
                e.preventDefault();
                const found = participants.find(p => p.lastName.toLowerCase() === loginForm.lastName.trim().toLowerCase() && p.phone.trim() === loginForm.phone.trim());
                if (found) { setIsAdmin(false); setUser(found); setView('home'); setShowAuthMenu(false); } 
                else { alert('Účastník s tímto příjmením a telefonním číslem nebyl nalezen.'); }
            };

            const handleImageUpload = (e, isEdit = false) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let scale = 1;
                        if (img.width > MAX_WIDTH) { scale = MAX_WIDTH / img.width; }
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.8);
                        if (isEdit) {
                            setEditForm(prev => ({...prev, imageUrl: base64}));
                        } else {
                            setNewAuction(prev => ({...prev, imageUrl: base64}));
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleCreateAuction = async (e) => {
                e.preventDefault();
                const startStr = `${newAuction.startDate}T${newAuction.startTime}`;
                const endStr = `${newAuction.endDate}T${newAuction.endTime}`;
                
                const createdDB = {
                    id: 'auc-' + Date.now(),
                    title: newAuction.title || 'iPhone Aukce',
                    product_name: newAuction.productName,
                    description: newAuction.description,
                    image_url: newAuction.imageUrl || '',
                    starting_price: Number(newAuction.startPrice),
                    min_bid_step: Number(newAuction.minBidStep) || 100,
                    auto_extend_minutes: Number(newAuction.autoExtendMinutes) || 0,
                    start_time: new Date(startStr).toISOString(),
                    ends_at: new Date(endStr).toISOString(),
                    status: 'active',
                    bids: []
                };

                const { error } = await supabase.from('auctions').insert([createdDB]);
                if (error) {
                    alert('Chyba při publikování: ' + error.message);
                    return;
                }

                await fetchData();
                setSelectedAdminAuction(null);
            };

            const handleSaveEditAuction = async (e) => {
                e.preventDefault();
                const startStr = `${editForm.startDate}T${editForm.startTime}`;
                const endStr = `${editForm.endDate}T${editForm.endTime}`;
                
                const updateData = {
                    title: editForm.title,
                    product_name: editForm.productName,
                    description: editForm.description,
                    image_url: editForm.imageUrl,
                    starting_price: Number(editForm.startPrice),
                    min_bid_step: Number(editForm.minBidStep),
                    auto_extend_minutes: Number(editForm.autoExtendMinutes),
                    start_time: new Date(startStr).toISOString(),
                    ends_at: new Date(endStr).toISOString()
                };

                const { error } = await supabase.from('auctions').update(updateData).eq('id', editingAuctionId);
                if (error) {
                    alert('Chyba při úpravě: ' + error.message);
                    return;
                }

                await fetchData();
                setEditingAuctionId(null);
                alert('Aukce byla úspěšně aktualizována.');
            };

            const handleDeleteAuction = async (aucId) => {
                if (confirm('Opravdu chcete tuto aukci smazat?')) {
                    await supabase.from('auctions').delete().eq('id', aucId);
                    await fetchData();
                    if (selectedAdminAuction && selectedAdminAuction.id === aucId) setSelectedAdminAuction(null);
                }
            };

            const handleEndAuctionEarly = async (aucId) => {
                if (confirm('Opravdu chcete tuto aukci okamžitě ukončit?')) {
                    await supabase.from('auctions').update({ status: 'ended', force_ended: true }).eq('id', aucId);
                    await fetchData();
                }
            };

            const getAuctionStatus = (auc) => {
                if (auc.forceEnded) return 'ended';
                const start = new Date(auc.startTime).getTime();
                const end = new Date(auc.endTime).getTime();
                if (now < start) return 'scheduled';
                if (now >= start && now < end) return 'active';
                return 'ended';
            };

            const getTimeLeftFormat = (targetTime) => {
                const diff = targetTime - now;
                if (diff <= 0) return '00:00:00';
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const m = Math.floor((diff / 1000 / 60) % 60);
                const s = Math.floor((diff / 1000) % 60);
                return `${d > 0 ? d + 'd ' : ''}${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            };

            const confirmBid = async () => {
                const currentAuction = auctions.find(a => a.id === selectedAuctionId);
                if (!currentAuction) return;

                let currentEndTime = new Date(currentAuction.endTime).getTime();
                if (currentAuction.autoExtendMinutes > 0) {
                    const extensionMs = currentAuction.autoExtendMinutes * 60 * 1000;
                    if (currentEndTime - now < extensionMs) {
                        currentEndTime = now + extensionMs;
                    }
                }

                const newBidObj = {
                    id: Date.now(),
                    firstName: user.firstName,
                    lastName: user.lastName,
                    phone: user.phone,
                    amount: pendingBid,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                const updatedBids = [newBidObj, ...(currentAuction.bids || [])];

                const { error } = await supabase.from('auctions').update({
                    ends_at: new Date(currentEndTime).toISOString(),
                    bids: updatedBids
                }).eq('id', selectedAuctionId);

                if (error) {
                    alert('Chyba při příhozu: ' + error.message);
                    return;
                }

                await fetchData();
                setShowConfirmModal(false);
                setCustomBidInput('');
                setSliderMultiplier(1);
            };

            const currentAuction = auctions.find(a => a.id === selectedAuctionId);

            const getCurrentHighest = (auc) => {
                if (!auc || !auc.bids || auc.bids.length === 0) return auc ? auc.startPrice : 0;
                return Math.max(...auc.bids.map(b => b.amount));
            };

            const getHighestBidder = (auc) => {
                if (!auc || !auc.bids || auc.bids.length === 0) return null;
                const sorted = [...auc.bids].sort((a,b) => b.amount - a.amount);
                return sorted[0];
            };

            const isUserWinning = (auc) => {
                if (!user || !auc || !auc.bids || auc.bids.length === 0) return false;
                const winning = getHighestBidder(auc);
                return winning && winning.phone === user.phone;
            };

            const minStep = currentAuction ? (currentAuction.minBidStep || 100) : 100;
            const currentHighestPrice = currentAuction ? getCurrentHighest(currentAuction) : 0;
            const sliderCalculatedAmount = currentHighestPrice + (sliderMultiplier * minStep);

            const IAukceLogo = () => (
                <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setView('home'); setSelectedAuctionId(null); setSelectedAdminAuction(null); }}>
                    <div className="bg-blue-600 p-1.5 rounded-lg text-white shadow flex items-end justify-center gap-0.5 w-7 h-7">
                        <div className="w-1 bg-white rounded-full h-1.5"></div>
                        <div className="w-1 bg-white rounded-full h-2.5"></div>
                        <div className="w-1 bg-white rounded-full h-3.5"></div>
                    </div>
                    <div>
                        <span className="text-base font-black tracking-tight text-slate-900">iAukce</span>
                    </div>
                </div>
            );

            return (
                <div className="h-screen flex flex-col bg-slate-100 text-slate-800 font-sans antialiased overflow-hidden">
                    <header className="bg-white border-b border-slate-200 px-3 py-2 flex items-center justify-between shadow-sm shrink-0">
                        <IAukceLogo />

                        <div className="flex items-center gap-2">
                            {isAdmin ? (
                                <div className="text-[11px] bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-200 text-slate-700">
                                    <span className="font-bold text-indigo-600">Admin</span>
                                    <button onClick={() => { setIsAdmin(false); setView('home'); }} className="ml-2 text-red-500 hover:underline">Odhlásit</button>
                                </div>
                            ) : user ? (
                                <div className="text-[11px] bg-blue-50 px-2.5 py-1 rounded-full border border-blue-200 text-slate-700">
                                    <span className="font-bold text-blue-600">{user.firstName}</span>
                                    <button onClick={() => { setUser(null); setView('home'); }} className="ml-2 text-red-500 hover:underline">Odhlásit</button>
                                </div>
                            ) : null}

                            {!isAdmin && !user ? (
                                <div className="relative">
                                    <button
                                        onClick={() => { setShowAuthMenu(!showAuthMenu); setShowAdminLoginBox(false); }}
                                        className="text-xs bg-blue-600 text-white font-bold px-3 py-1.5 rounded-lg shadow"
                                    >
                                        Přihlášení
                                    </button>
                                    {showAuthMenu && (
                                        <div className="absolute right-0 top-full mt-2 w-64 bg-white rounded-xl border border-slate-200 shadow-2xl p-3 z-50 text-left space-y-2">
                                            <button onClick={() => { setView('register'); setShowAuthMenu(false); }} className="w-full bg-blue-600 text-white font-bold text-xs px-3 py-2 rounded-lg shadow">
                                                Registrace účastníka
                                            </button>
                                            
                                            <form onSubmit={handleLoginExisting} className="space-y-1.5 border-t pt-2">
                                                <span className="text-[11px] font-bold text-slate-700 block">Již registrován:</span>
                                                <input type="text" placeholder="Příjmení" value={loginForm.lastName} onChange={e => setLoginForm({...loginForm, lastName: e.target.value})} className="w-full bg-slate-50 border rounded px-2 py-1 text-xs" />
                                                <input type="tel" placeholder="Telefon" value={loginForm.phone} onChange={e => setLoginForm({...loginForm, phone: e.target.value})} className="w-full bg-slate-50 border rounded px-2 py-1 text-xs" />
                                                <button type="submit" className="w-full bg-slate-900 text-white font-bold py-1 rounded text-xs">Přihlásit</button>
                                            </form>

                                            <div className="pt-1 border-t">
                                                <button onClick={() => setShowAdminLoginBox(!showAdminLoginBox)} className="text-[10px] text-slate-500 hover:text-indigo-600 font-semibold">
                                                    Admin přihlášení
                                                </button>
                                                {showAdminLoginBox && (
                                                    <form onSubmit={handleAdminLogin} className="mt-1 space-y-1">
                                                        <input type="text" placeholder="Jméno" value={adminUser} onChange={e => setAdminUser(e.target.value)} className="w-full bg-slate-50 border rounded px-2 py-1 text-xs" />
                                                        <input type="password" placeholder="Heslo" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} className="w-full bg-slate-50 border rounded px-2 py-1 text-xs" />
                                                        {adminLoginError && <span className="text-[9px] text-red-600 block">Chyba.</span>}
                                                        <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-1 rounded text-xs">Vstoupit</button>
                                                    </form>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ) : isAdmin ? (
                                <button onClick={() => { setView('admin'); setSelectedAdminAuction(null); }} className="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold shadow">Správa</button>
                            ) : null}
                        </div>
                    </header>

                    <main className="flex-1 max-w-lg w-full mx-auto p-2 flex flex-col justify-between overflow-hidden">
                        {view === 'home' && !selectedAuctionId && (
                            <div className="space-y-3 overflow-y-auto max-h-full pr-1">
                                <div className="bg-blue-600 text-white p-3 rounded-xl shadow text-xs">
                                    <h1 className="text-base font-black mb-1">Aukce iPhone Duo</h1>
                                    <p className="text-blue-100 leading-snug">Vítejte v aukci na iPhone pro předobjednávky.</p>
                                </div>

                                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-500 border-b pb-1">Seznam aukcí</h2>
                                
                                <div className="space-y-3">
                                    {auctions.map(auc => {
                                        const currentPrice = getCurrentHighest(auc);
                                        const status = getAuctionStatus(auc);
                                        const endTime = new Date(auc.endTime).getTime();

                                        return (
                                            <div key={auc.id} className="bg-white rounded-xl border border-slate-200 p-3 shadow-sm flex items-center justify-between gap-3">
                                                <div className="w-16 h-16 bg-slate-50 border rounded-lg flex items-center justify-center shrink-0">
                                                    {auc.imageUrl ? (
                                                        <img src={auc.imageUrl} alt={auc.productName} className="max-h-full max-w-full object-contain" />
                                                    ) : (
                                                        <span className="text-[10px] text-slate-300">Bez fotky</span>
                                                    )}
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <h3 className="text-sm font-bold text-slate-900 truncate">{auc.productName}</h3>
                                                    <span className="text-xs text-emerald-600 font-black block">{currentPrice.toLocaleString()} Kč</span>
                                                    {status === 'active' && (
                                                        <span className="text-[10px] text-slate-400 font-semibold block">Končí za: {getTimeLeftFormat(endTime)}</span>
                                                    )}
                                                </div>
                                                <button 
                                                    onClick={() => {
                                                        if (isAdmin) {
                                                            alert('Jste admin.');
                                                        } else if (!user) {
                                                            setView('register');
                                                        } else {
                                                            setSelectedAuctionId(auc.id);
                                                            setView('auction');
                                                        }
                                                    }}
                                                    className="bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded-lg shadow"
                                                >
                                                    Detail
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {view === 'register' && (
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-lg space-y-3 max-w-sm mx-auto my-auto">
                                <h2 className="text-lg font-bold text-slate-900">Registrace</h2>
                                <form onSubmit={handleRegister} className="space-y-2 text-xs">
                                    <div>
                                        <label className="block font-bold mb-1">Křestní jméno</label>
                                        <input type="text" required value={regForm.firstName} onChange={e => setRegForm({...regForm, firstName: e.target.value})} className="w-full border rounded-lg p-2" placeholder="Jan" />
                                    </div>
                                    <div>
                                        <label className="block font-bold mb-1">Příjmení</label>
                                        <input type="text" required value={regForm.lastName} onChange={e => setRegForm({...regForm, lastName: e.target.value})} className="w-full border rounded-lg p-2" placeholder="Novák" />
                                    </div>
                                    <div>
                                        <label className="block font-bold mb-1">Telefonní číslo</label>
                                        <input type="tel" required value={regForm.phone} onChange={e => setRegForm({...regForm, phone: e.target.value})} className="w-full border rounded-lg p-2" placeholder="+420..." />
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg shadow">Vstoupit do aukce</button>
                                </form>
                                <button onClick={() => setView('home')} className="w-full text-xs text-slate-500 text-center">Zpět</button>
                            </div>
                        )}

                        {/* DETAIL AUKCE - PEVNÝ RÁMEC BEZ SCROLLOVÁNÍ */}
                        {view === 'auction' && currentAuction && (
                            <div className="bg-white rounded-xl border border-slate-200 p-3 shadow-md h-full flex flex-col justify-between overflow-hidden relative">
                                {/* HLAVIČKA */}
                                <div className="flex items-center justify-between border-b pb-2 shrink-0">
                                    <button onClick={() => { setSelectedAuctionId(null); setView('home'); }} className="text-blue-600 font-bold text-xs">← Zpět</button>
                                    <h1 className="text-xs font-bold text-slate-700 truncate max-w-[180px]">{currentAuction.productName}</h1>
                                    <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">
                                        {getTimeLeftFormat(new Date(currentAuction.endTime).getTime())}
                                    </span>
                                </div>

                                {/* OBRÁZEK UPROSTŘED NAHOŘE */}
                                <div className="h-28 bg-slate-50 rounded-lg p-1 border flex items-center justify-center shrink-0 my-1">
                                    {currentAuction.imageUrl ? (
                                        <img src={currentAuction.imageUrl} alt={currentAuction.productName} className="h-full object-contain" />
                                    ) : (
                                        <span className="text-[10px] text-slate-300">Bez fotky</span>
                                    )}
                                </div>

                                {/* STAV & CENA */}
                                <div className="text-center shrink-0 my-1">
                                    {isUserWinning(currentAuction) ? (
                                        <span className="text-emerald-600 text-xs font-black uppercase tracking-wide block">
                                            ✓ VYHRÁVÁTE S NABÍDKOU
                                        </span>
                                    ) : (
                                        <span className="text-slate-600 text-xs font-bold block truncate">
                                            Vyhrává nabídka: <strong className="text-slate-900 font-black">{getHighestBidder(currentAuction) ? getHighestBidder(currentAuction).firstName : 'Vyvolávací'}</strong>
                                        </span>
                                    )}
                                    <div className="text-3xl font-black text-slate-900 leading-tight">
                                        {currentHighestPrice.toLocaleString()} <span className="text-lg text-slate-500">Kč</span>
                                    </div>
                                </div>

                                {/* ZADÁNÍ ČÁSTKY VOULNOU RUKOU / VEPSÁNÍM */}
                                <div className="flex gap-1.5 shrink-0 my-1">
                                    <input 
                                        type="number" 
                                        placeholder="Vlastní částka Kč..." 
                                        value={customBidInput} 
                                        onChange={e => setCustomBidInput(e.target.value)} 
                                        className="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs flex-1 text-slate-900 font-bold" 
                                    />
                                    <button 
                                        onClick={() => {
                                            const val = Number(customBidInput);
                                            if (!val || val <= currentHighestPrice) {
                                                alert(`Příhoz musí být vyšší než ${currentHighestPrice.toLocaleString()} Kč.`);
                                                return;
                                            }
                                            setPendingBid(val);
                                            setShowConfirmModal(true);
                                        }}
                                        className="bg-slate-900 text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow shrink-0"
                                    >
                                        Přihodit
                                    </button>
                                </div>

                                {/* POSUVNÉ TLAČÍTKO / POSUVNÍK */}
                                <div className="bg-slate-50 p-2 rounded-lg border space-y-1.5 shrink-0 my-1">
                                    <div className="flex justify-between text-[11px] font-bold text-slate-600">
                                        <span>Navýšit posuvníkem:</span>
                                        <span className="text-blue-600 font-black">+{sliderMultiplier * minStep} Kč ({sliderCalculatedAmount.toLocaleString()} Kč)</span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min="1" 
                                        max="20" 
                                        step="1"
                                        value={sliderMultiplier} 
                                        onChange={e => setSliderMultiplier(Number(e.target.value))}
                                        className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                    />
                                    <button 
                                        onClick={() => {
                                            setPendingBid(sliderCalculatedAmount);
                                            setShowConfirmModal(true);
                                        }}
                                        className="w-full bg-emerald-600 text-white font-black text-xs py-2 rounded-lg shadow"
                                    >
                                        Potvrdit příhoz {sliderCalculatedAmount.toLocaleString()} Kč
                                    </button>
                                </div>

                                {/* TABULKA POSLEDNÍCH PŘIHOZŮ (MAX 6) */}
                                <div className="flex-1 min-h-0 flex flex-col justify-between border-t pt-1">
                                    <div className="flex justify-between items-center mb-1">
                                        <span className="text-[10px] font-bold uppercase text-slate-400">Poslední příhozy</span>
                                        {currentAuction.bids.length > 6 && (
                                            <button 
                                                onClick={() => setShowAllBidsModal(true)}
                                                className="text-[10px] text-blue-600 font-bold hover:underline"
                                            >
                                                Zobrazit všech {currentAuction.bids.length} ↓
                                            </button>
                                        )}
                                    </div>

                                    <div className="space-y-1 overflow-hidden flex-1">
                                        {currentAuction.bids.length === 0 ? (
                                            <p className="text-slate-400 text-[10px] italic text-center py-1">Zatím nepadnul žádný příhoz.</p>
                                        ) : (
                                            currentAuction.bids.slice(0, 6).map((b, i) => (
                                                <div key={i} className="flex justify-between items-center bg-slate-50 px-2 py-0.5 rounded text-[11px] border border-slate-100">
                                                    <span className="font-bold text-slate-800 truncate max-w-[120px]">{b.firstName} <span className="text-[9px] text-slate-400 font-normal">({b.time})</span></span>
                                                    <strong className="text-emerald-600 font-black">{b.amount.toLocaleString()} Kč</strong>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ADMIN REŽIM */}
                        {view === 'admin' && isAdmin && (
                            <div className="space-y-3 overflow-y-auto max-h-full">
                                {selectedAdminAuction === 'new' ? (
                                    <div className="bg-white p-3 rounded-xl shadow space-y-2 border text-xs">
                                        <div className="flex justify-between items-center border-b pb-1">
                                            <h2 className="font-bold">Nová aukce</h2>
                                            <button onClick={() => setSelectedAdminAuction(null)} className="text-[10px] text-slate-500">Zpět</button>
                                        </div>
                                        <form onSubmit={handleCreateAuction} className="space-y-2">
                                            <input type="text" placeholder="Název aukce" value={newAuction.title} onChange={e => setNewAuction({...newAuction, title: e.target.value})} className="w-full border p-1.5 rounded" />
                                            <input type="text" placeholder="Produkt" value={newAuction.productName} onChange={e => setNewAuction({...newAuction, productName: e.target.value})} className="w-full border p-1.5 rounded" required />
                                            <textarea placeholder="Popis..." value={newAuction.description} onChange={e => setNewAuction({...newAuction, description: e.target.value})} className="w-full border p-1.5 rounded" rows="2" />
                                            <input type="file" accept="image/*" onChange={e => handleImageUpload(e, false)} className="w-full text-[10px]" />
                                            <div className="grid grid-cols-2 gap-1">
                                                <input type="number" placeholder="Vyvolávací cena" value={newAuction.startPrice} onChange={e => setNewAuction({...newAuction, startPrice: e.target.value})} className="border p-1.5 rounded" />
                                                <input type="number" placeholder="Min. krok příhozu" value={newAuction.minBidStep} onChange={e => setNewAuction({...newAuction, minBidStep: e.target.value})} className="border p-1.5 rounded" />
                                            </div>
                                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-2 rounded shadow">Vytvořit aukci</button>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center">
                                            <h1 className="text-sm font-black">Správa aukcí</h1>
                                            <button onClick={() => setSelectedAdminAuction('new')} className="bg-blue-600 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg shadow">＋ Nová aukce</button>
                                        </div>

                                        <div className="space-y-2">
                                            {auctions.map(auc => (
                                                <div key={auc.id} className="bg-white border rounded-xl p-2.5 flex justify-between items-center shadow-sm text-xs">
                                                    <div>
                                                        <h3 className="font-bold">{auc.productName}</h3>
                                                        <span className="text-[10px] text-slate-500">Cena: <strong className="text-emerald-600">{getCurrentHighest(auc).toLocaleString()} Kč</strong></span>
                                                    </div>
                                                    <div className="flex gap-1">
                                                        <button onClick={() => handleDeleteAuction(auc.id)} className="bg-red-600 text-white font-bold px-2 py-1 rounded text-[10px]">Smazat</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODÁLNÍ OKNO PRO ZOBRAZENÍ VŠECH PŘIHOZŮ */}
                    {showAllBidsModal && currentAuction && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-4 rounded-xl max-w-sm w-full space-y-3 shadow-2xl max-h-[80vh] flex flex-col">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-slate-900 text-sm">Všechny příhozy ({currentAuction.bids.length})</h3>
                                    <button onClick={() => setShowAllBidsModal(false)} className="text-xs text-slate-500 font-bold">✕ Zavřít</button>
                                </div>
                                <div className="space-y-1.5 overflow-y-auto flex-1 pr-1">
                                    {currentAuction.bids.map((b, i) => (
                                        <div key={i} className="flex justify-between items-center bg-slate-50 p-2 rounded text-xs border">
                                            <div>
                                                <span className="font-bold text-slate-900 block">{b.firstName} {b.lastName}</span>
                                                <span className="text-[10px] text-slate-400">{b.time}</span>
                                            </div>
                                            <strong className="text-emerald-600 font-black text-sm">{b.amount.toLocaleString()} Kč</strong>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* POTVRZOVACÍ MODÁLNÍ OKNO */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-5 rounded-xl max-w-xs w-full text-center space-y-3 shadow-2xl">
                                <h3 className="font-bold text-slate-900 text-sm">Potvrdit příhoz {pendingBid.toLocaleString()} Kč?</h3>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 bg-slate-200 py-2 rounded-lg font-bold text-xs">Zrušit</button>
                                    <button onClick={confirmBid} className="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold text-xs shadow">Potvrdit</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
