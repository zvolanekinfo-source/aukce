<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iAukce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = "https://uwfpyjbvgyesxmpzedcs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_44EjLS-r5zu7hEVK6ZZO9A_a28zzo01";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const toYMD = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        const toHM = (date) => `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;

        function App() {
            const [user, setUser] = React.useState(() => {
                const saved = localStorage.getItem('iaukce_session');
                return saved ? JSON.parse(saved) : null;
            });
            const [isAdmin, setIsAdmin] = React.useState(() => {
                return localStorage.getItem('iaukce_auth') === 'true';
            });
            
            const [view, setView] = React.useState('home');
            const [selectedAuctionId, setSelectedAuctionId] = React.useState(null);
            const [selectedAdminAuction, setSelectedAdminAuction] = React.useState(null);

            const [footerVisible, setFooterVisible] = React.useState(true);
            const [showAdminLoginBox, setShowAdminLoginBox] = React.useState(false);
            const [showAuthMenu, setShowAuthMenu] = React.useState(false);

            const [regForm, setRegForm] = React.useState({ firstName: '', lastName: '', phone: '' });
            const [loginForm, setLoginForm] = React.useState({ lastName: '', phone: '' });
            
            const [adminUser, setAdminUser] = React.useState('');
            const [adminPassword, setAdminPassword] = React.useState('');
            const [adminLoginError, setAdminLoginError] = React.useState(false);

            const [now, setNow] = React.useState(Date.now());
            React.useEffect(() => {
                const interval = setInterval(() => setNow(Date.now()), 1000);
                return () => clearInterval(interval);
            }, []);

            const [auctions, setAuctions] = React.useState([]);
            const [participants, setParticipants] = React.useState([]);

            // Funkce načtení dat
            const fetchData = async () => {
                try {
                    const { data: aucData, error: aucErr } = await supabase.from('auctions').select('*');
                    if (aucErr) console.error("Chyba aukcí:", aucErr);
                    if (aucData) {
                        const formattedAuctions = aucData.map(a => ({
                            id: a.id,
                            title: a.title || 'iPhone Aukce',
                            productName: a.product_name || a.productName || 'iPhone',
                            description: a.description || '',
                            imageUrl: a.image_url || a.imageUrl || '',
                            startPrice: Number(a.starting_price || a.start_price || a.startPrice || 1000),
                            minBidStep: Number(a.min_bid_step || a.minBidStep || 100),
                            autoExtendMinutes: Number(a.auto_extend_minutes || a.autoExtendMinutes || 0),
                            startTime: a.start_time || a.created_at || new Date().toISOString(),
                            endTime: a.ends_at || a.end_time || a.endTime || new Date(Date.now() + 86400000).toISOString(),
                            forceEnded: a.force_ended || (a.status === 'ended'),
                            bids: a.bids || []
                        }));
                        setAuctions(formattedAuctions);
                    }

                    const { data: partData, error: partErr } = await supabase.from('participants').select('*');
                    if (partErr) console.error("Chyba účastníků:", partErr);
                    if (partData) {
                        const formattedParticipants = partData.map(p => ({
                            id: p.id,
                            firstName: p.first_name || p.firstName || '',
                            lastName: p.last_name || p.lastName || '',
                            phone: p.phone || ''
                        }));
                        setParticipants(formattedParticipants);
                    }
                } catch (err) {
                    console.error("Chyba načítání:", err);
                }
            };

            React.useEffect(() => {
                fetchData();

                const channel = supabase.channel('realtime-auctions')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'auctions' }, () => fetchData())
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'participants' }, () => fetchData())
                    .subscribe();

                return () => {
                    supabase.removeChannel(channel);
                };
            }, []);

            const today = new Date();
            const tomorrow = new Date(Date.now() + 86400000);

            const [newAuction, setNewAuction] = React.useState({
                title: 'iPhone Aukce',
                productName: '',
                description: '',
                imageUrl: '',
                startPrice: 1000,
                minBidStep: 100,
                autoExtendMinutes: 2,
                startDate: toYMD(today),
                startTime: toHM(today),
                endDate: toYMD(tomorrow),
                endTime: toHM(tomorrow)
            });

            const [editingAuctionId, setEditingAuctionId] = React.useState(null);
            const [editForm, setEditForm] = React.useState({ 
                title: '', productName: '', description: '', imageUrl: '', 
                startPrice: 1000, minBidStep: 100, autoExtendMinutes: 2,
                startDate: '', startTime: '', endDate: '', endTime: '' 
            });

            const [bidSliderOffset, setBidSliderOffset] = React.useState(0);
            const [customBidInput, setCustomBidInput] = React.useState('');
            const [showConfirmModal, setShowConfirmModal] = React.useState(false);
            const [pendingBid, setPendingBid] = React.useState(0);

            React.useEffect(() => { 
                localStorage.setItem('iaukce_session', JSON.stringify(user)); 
            }, [user]);
            
            React.useEffect(() => { 
                localStorage.setItem('iaukce_auth', isAdmin); 
            }, [isAdmin]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                const targetPass = String.fromCharCode(64, 100, 109, 105, 110, 49);
                if (adminUser.trim() === 'Zvolanek1' && adminPassword === targetPass) {
                    setUser(null); setIsAdmin(true); setAdminLoginError(false); setView('admin'); setShowAuthMenu(false);
                } else { 
                    setAdminLoginError(true); 
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!regForm.firstName || !regForm.lastName || !regForm.phone) {
                    alert('Prosím vyplňte všechna pole.'); return;
                }
                const newUser = { id: String(Date.now()), first_name: regForm.firstName.trim(), last_name: regForm.lastName.trim(), phone: regForm.phone.trim() };
                
                const { error } = await supabase.from('participants').insert([newUser]);
                if (error) {
                    console.error(error);
                }

                const clientUser = { id: newUser.id, firstName: newUser.first_name, lastName: newUser.last_name, phone: newUser.phone };
                setIsAdmin(false); 
                setUser(clientUser);
                await fetchData();
                setView('home');
            };

            const handleLoginExisting = (e) => {
                e.preventDefault();
                const found = participants.find(p => p.lastName.toLowerCase() === loginForm.lastName.trim().toLowerCase() && p.phone.trim() === loginForm.phone.trim());
                if (found) { setIsAdmin(false); setUser(found); setView('home'); setShowAuthMenu(false); } 
                else { alert('Účastník s tímto příjmením a telefonním číslem nebyl nalezen.'); }
            };

            const handleImageUpload = (e, isEdit = false) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let scale = 1;
                        if (img.width > MAX_WIDTH) { scale = MAX_WIDTH / img.width; }
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.8);
                        if (isEdit) {
                            setEditForm(prev => ({...prev, imageUrl: base64}));
                        } else {
                            setNewAuction(prev => ({...prev, imageUrl: base64}));
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleCreateAuction = async (e) => {
                e.preventDefault();
                const startStr = `${newAuction.startDate}T${newAuction.startTime}`;
                const endStr = `${newAuction.endDate}T${newAuction.endTime}`;
                
                const createdDB = {
                    id: 'auc-' + Date.now(),
                    title: newAuction.title || 'iPhone Aukce',
                    product_name: newAuction.productName,
                    description: newAuction.description,
                    image_url: newAuction.imageUrl || '',
                    starting_price: Number(newAuction.startPrice),
                    min_bid_step: Number(newAuction.minBidStep) || 100,
                    auto_extend_minutes: Number(newAuction.autoExtendMinutes) || 0,
                    start_time: new Date(startStr).toISOString(),
                    ends_at: new Date(endStr).toISOString(),
                    status: 'active',
                    bids: []
                };

                const { error } = await supabase.from('auctions').insert([createdDB]);
                if (error) {
                    alert('Chyba při ukládání: ' + error.message);
                    return;
                }

                await fetchData();
                setSelectedAdminAuction(null);
                alert('Aukce byla ihned publikována pro všechna zařízení!');
            };

            const handleDeleteAuction = async (aucId) => {
                if (confirm('Opravdu chcete tuto aukci smazat?')) {
                    const { error } = await supabase.from('auctions').delete().eq('id', aucId);
                    if (error) alert('Chyba mazání: ' + error.message);
                    await fetchData();
                    if (selectedAdminAuction && selectedAdminAuction.id === aucId) setSelectedAdminAuction(null);
                }
            };

            const getAuctionStatus = (auc) => {
                if (auc.forceEnded) return 'ended';
                const start = new Date(auc.startTime).getTime();
                const end = new Date(auc.endTime).getTime();
                if (now < start) return 'scheduled';
                if (now >= start && now < end) return 'active';
                return 'ended';
            };

            const getTimeLeftFormat = (targetTime) => {
                const diff = targetTime - now;
                if (diff <= 0) return '00:00:00';
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const m = Math.floor((diff / 1000 / 60) % 60);
                const s = Math.floor((diff / 1000) % 60);
                return `${d > 0 ? d + 'd ' : ''}${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            };

            const confirmBid = async () => {
                const currentAuction = auctions.find(a => a.id === selectedAuctionId);
                if (!currentAuction) return;

                let currentEndTime = new Date(currentAuction.endTime).getTime();
                if (currentAuction.autoExtendMinutes > 0) {
                    const extensionMs = currentAuction.autoExtendMinutes * 60 * 1000;
                    if (currentEndTime - now < extensionMs) {
                        currentEndTime = now + extensionMs;
                    }
                }

                const newBidObj = {
                    id: Date.now(),
                    firstName: user.firstName,
                    lastName: user.lastName,
                    phone: user.phone,
                    amount: pendingBid,
                    time: new Date().toLocaleTimeString()
                };

                const updatedBids = [newBidObj, ...(currentAuction.bids || [])];

                const { error } = await supabase.from('auctions').update({
                    ends_at: new Date(currentEndTime).toISOString(),
                    bids: updatedBids
                }).eq('id', selectedAuctionId);

                if (error) {
                    alert('Chyba při příhozu: ' + error.message);
                    return;
                }

                await fetchData();
                setShowConfirmModal(false);
                setCustomBidInput('');
                setBidSliderOffset(0);
            };

            const currentAuction = auctions.find(a => a.id === selectedAuctionId);

            const getCurrentHighest = (auc) => {
                if (!auc.bids || auc.bids.length === 0) return auc.startPrice;
                return Math.max(...auc.bids.map(b => b.amount));
            };

            const isUserWinning = (auc) => {
                if (!user || !auc.bids || auc.bids.length === 0) return false;
                const sorted = [...auc.bids].sort((a,b) => b.amount - a.amount);
                return sorted[0].phone === user.phone;
            };

            const minStep = currentAuction ? (currentAuction.minBidStep || 100) : 100;
            const calculatedBidAmount = currentAuction ? getCurrentHighest(currentAuction) + Number(bidSliderOffset) * minStep : 0;

            const IAukceLogo = () => (
                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => { setView('home'); setSelectedAuctionId(null); setSelectedAdminAuction(null); }}>
                    <div className="bg-blue-600 p-2 rounded-xl text-white shadow-md flex items-end justify-center gap-1 w-9 h-9">
                        <div className="w-1 bg-white rounded-full h-2"></div>
                        <div className="w-1 bg-white rounded-full h-3.5"></div>
                        <div className="w-1 bg-white rounded-full h-5"></div>
                    </div>
                    <div>
                        <span className="text-xl font-black tracking-tight text-slate-900">iAukce</span>
                        <span className="block text-[9px] text-slate-500 tracking-widest uppercase font-semibold">Soukromé aukce</span>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans antialiased pb-28 relative">
                    <header className="bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-sm">
                        <IAukceLogo />

                        <div className="flex items-center gap-2 md:gap-3">
                            {isAdmin ? (
                                <div className="text-xs bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-200 text-slate-700">
                                    <span className="font-bold text-indigo-600">Admin Režim</span>
                                    <button onClick={() => { setIsAdmin(false); setView('home'); }} className="ml-2 text-red-500 hover:underline font-medium">Odhlásit</button>
                                </div>
                            ) : user ? (
                                <div className="text-xs bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200 text-slate-700">
                                    <span className="font-bold text-blue-600">{user.firstName}</span>
                                    <button onClick={() => { setUser(null); setView('home'); }} className="ml-2 text-red-500 hover:underline font-medium">Odhlásit</button>
                                </div>
                            ) : null}

                            {!isAdmin && !user ? (
                                <div className="relative">
                                    <button
                                        onClick={() => { setShowAuthMenu(!showAuthMenu); setShowAdminLoginBox(false); }}
                                        className="text-xs md:text-sm bg-blue-600 hover:bg-blue-700 text-white font-bold px-3.5 py-2 rounded-xl transition shadow"
                                    >
                                        Přihlášení / Registrace
                                    </button>
                                    {showAuthMenu && (
                                        <div className="absolute right-0 top-full mt-2 w-72 bg-white rounded-2xl border border-slate-200 shadow-2xl p-4 z-50 text-left space-y-3">
                                            <button onClick={() => { setView('register'); setShowAuthMenu(false); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-4 py-2.5 rounded-xl shadow transition">
                                                Registrace účastníka
                                            </button>
                                            
                                            <form onSubmit={handleLoginExisting} className="space-y-2 border-t border-slate-100 pt-3">
                                                <span className="text-xs font-bold text-slate-700 block">Již registrován:</span>
                                                <input type="text" placeholder="Příjmení" value={loginForm.lastName} onChange={e => setLoginForm({...loginForm, lastName: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900" />
                                                <input type="tel" placeholder="Telefonní číslo" value={loginForm.phone} onChange={e => setLoginForm({...loginForm, phone: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xs text-slate-900" />
                                                <button type="submit" className="w-full bg-slate-900 text-white font-bold py-2 rounded-lg text-xs shadow">Přihlásit se</button>
                                            </form>

                                            <div className="mt-2 pt-2 border-t border-slate-100">
                                                <button onClick={() => setShowAdminLoginBox(!showAdminLoginBox)} className="text-[11px] text-slate-500 hover:text-indigo-600 font-semibold">
                                                    {showAdminLoginBox ? 'Skrýt admin přihlášení' : 'Přihlášení administrátora'}
                                                </button>
                                                {showAdminLoginBox && (
                                                    <form onSubmit={handleAdminLogin} className="mt-2 space-y-2">
                                                        <input type="text" placeholder="Uživatelské jméno" value={adminUser} onChange={e => setAdminUser(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs" />
                                                        <input type="password" placeholder="Heslo" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs" />
                                                        {adminLoginError && <span className="text-[10px] text-red-600 block">Nesprávné údaje.</span>}
                                                        <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-1.5 rounded-lg text-xs shadow">Vstoupit jako Admin</button>
                                                    </form>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ) : isAdmin ? (
                                <button onClick={() => { setView('admin'); setSelectedAdminAuction(null); }} className="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-xl font-bold transition shadow">Správa aukcí</button>
                            ) : null}
                        </div>
                    </header>

                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">
                        {view === 'home' && !selectedAuctionId && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-6 md:p-8 rounded-2xl shadow-lg">
                                    <h1 className="text-2xl md:text-3xl font-black mb-2">Vítejte na aukci iPhone Duo</h1>
                                    <p className="text-blue-100 text-sm leading-relaxed">
                                        Tuto stránku jsem vytvořil, abych urychlil a zjednodušil hledání zájemců o předobjednávku iPhonu.
                                    </p>
                                </div>

                                <h2 className="text-xl font-bold text-slate-900 border-b border-slate-200 pb-2">Probíhající a připravené aukce</h2>
                                
                                {auctions.length === 0 ? (
                                    <div className="bg-white border border-slate-200 rounded-2xl p-8 text-center shadow-sm">
                                        <p className="text-slate-500 text-sm">Aktuálně neprobíhají žádné aukce.</p>
                                    </div>
                                ) : (
                                    <div className="grid gap-6 md:grid-cols-2">
                                        {auctions.map(auc => {
                                            const currentPrice = getCurrentHighest(auc);
                                            const status = getAuctionStatus(auc);
                                            const startTime = new Date(auc.startTime).getTime();
                                            const endTime = new Date(auc.endTime).getTime();

                                            return (
                                                <div key={auc.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-md flex flex-col justify-between hover:border-blue-300 transition">
                                                    <div>
                                                        <div className="h-56 relative bg-white flex items-center justify-center p-2 border-b border-slate-100">
                                                            {auc.imageUrl ? (
                                                                <img src={auc.imageUrl} alt={auc.productName} className="w-full h-full object-contain drop-shadow-sm" />
                                                            ) : (
                                                                <span className="text-slate-300 text-xs">Bez fotografie</span>
                                                            )}
                                                            
                                                            <div className="absolute top-3 right-3 flex flex-col gap-1 items-end">
                                                                <span className={`text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest shadow-md ${
                                                                    status === 'active' ? 'bg-emerald-600 text-white' : 
                                                                    status === 'scheduled' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-white'
                                                                }`}>
                                                                    {status === 'active' ? 'Probíhá' : status === 'scheduled' ? 'Připravuje se' : 'Skončila'}
                                                                </span>
                                                                
                                                                {status === 'active' && (
                                                                    <span className="bg-white/90 backdrop-blur text-slate-800 text-[10px] font-bold px-2.5 py-1 rounded-md shadow flex items-center gap-1 border border-slate-200">
                                                                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                                                        Končí za: {getTimeLeftFormat(endTime)}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>
                                                        <div className="p-5 space-y-2">
                                                            <span className="text-xs text-blue-600 font-bold uppercase tracking-wide">{auc.title}</span>
                                                            <h3 className="text-lg font-bold text-slate-900">{auc.productName}</h3>
                                                            <p className="text-slate-600 text-xs line-clamp-2 leading-relaxed">{auc.description}</p>
                                                        </div>
                                                    </div>

                                                    <div className="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                                                        <div>
                                                            <span className="text-[10px] text-slate-500 block uppercase font-semibold">Aktuální cena</span>
                                                            <span className="text-xl font-black text-emerald-600">{currentPrice.toLocaleString()} Kč</span>
                                                        </div>
                                                        <button 
                                                            onClick={() => {
                                                                if (isAdmin) {
                                                                    alert('Jste přihlášeni jako Admin.');
                                                                } else if (!user) {
                                                                    setView('register');
                                                                } else {
                                                                    setSelectedAuctionId(auc.id);
                                                                    setView('auction');
                                                                }
                                                            }}
                                                            className="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-4 py-2.5 rounded-xl transition shadow"
                                                        >
                                                            Zúčastnit se →
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'register' && (
                            <div className="max-w-md mx-auto space-y-4">
                                <div className="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-xl">
                                    <h2 className="text-2xl font-bold text-slate-900 mb-2">Registrace do aukce</h2>
                                    <form onSubmit={handleRegister} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Křestní jméno</label>
                                            <input type="text" required value={regForm.firstName} onChange={e => setRegForm({...regForm, firstName: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 text-sm" placeholder="Jan" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Příjmení</label>
                                            <input type="text" required value={regForm.lastName} onChange={e => setRegForm({...regForm, lastName: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 text-sm" placeholder="Novák" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Telefonní číslo</label>
                                            <input type="tel" required value={regForm.phone} onChange={e => setRegForm({...regForm, phone: e.target.value})} className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-slate-900 text-sm" placeholder="+420 123 456 789" />
                                        </div>
                                        <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow mt-2">Dokončit registraci</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {view === 'auction' && currentAuction && (
                            <div className="space-y-6 bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-slate-100">
                                <button onClick={() => { setSelectedAuctionId(null); setView('home'); }} className="text-blue-600 font-bold text-sm">← Zpět na seznam aukcí</button>
                                
                                <div className="flex flex-col md:flex-row justify-between items-start gap-4 border-b pb-6">
                                    <div>
                                        <span className="text-xs text-blue-600 font-bold uppercase">{currentAuction.title}</span>
                                        <h1 className="text-2xl md:text-3xl font-black text-slate-900">{currentAuction.productName}</h1>
                                        <p className="text-xs text-slate-500 mt-1">{currentAuction.description}</p>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-xs text-slate-400 block uppercase font-bold">Aktuální cena</span>
                                        <span className="text-3xl font-black text-emerald-600">{getCurrentHighest(currentAuction).toLocaleString()} Kč</span>
                                    </div>
                                </div>

                                <div className="p-6 rounded-2xl border text-center space-y-6 bg-slate-50">
                                    <button 
                                        onClick={() => {
                                            setPendingBid(getCurrentHighest(currentAuction) + minStep);
                                            setShowConfirmModal(true);
                                        }}
                                        className="w-full max-w-sm bg-emerald-600 hover:bg-emerald-500 text-white font-black text-lg py-4 rounded-2xl shadow-xl transition"
                                    >
                                        Přihodit {(getCurrentHighest(currentAuction) + minStep).toLocaleString()} Kč
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* ADMIN REŽIM */}
                        {view === 'admin' && isAdmin && (
                            <div className="space-y-6">
                                {selectedAdminAuction === 'new' ? (
                                    <div className="bg-white p-6 rounded-2xl shadow space-y-4 border border-slate-200">
                                        <div className="flex justify-between items-center border-b pb-3">
                                            <h2 className="text-lg font-bold">Nová aukce</h2>
                                            <button onClick={() => setSelectedAdminAuction(null)} className="text-xs text-slate-500">Zpět</button>
                                        </div>
                                        <form onSubmit={handleCreateAuction} className="space-y-3 text-xs">
                                            <div>
                                                <label className="block font-bold mb-1">Název produktu</label>
                                                <input type="text" placeholder="např. iPhone 16 Pro" value={newAuction.productName} onChange={e => setNewAuction({...newAuction, productName: e.target.value})} className="w-full border p-2.5 rounded-xl" required />
                                            </div>
                                            <div>
                                                <label className="block font-bold mb-1">Popis</label>
                                                <textarea placeholder="Popis..." value={newAuction.description} onChange={e => setNewAuction({...newAuction, description: e.target.value})} className="w-full border p-2.5 rounded-xl" rows="3" />
                                            </div>
                                            <div>
                                                <label className="block font-bold mb-1">Fotografie</label>
                                                <input type="file" accept="image/*" onChange={e => handleImageUpload(e, false)} className="w-full" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="block font-bold mb-1">Vyvolávací cena (Kč)</label>
                                                    <input type="number" value={newAuction.startPrice} onChange={e => setNewAuction({...newAuction, startPrice: e.target.value})} className="w-full border p-2.5 rounded-xl" />
                                                </div>
                                                <div>
                                                    <label className="block font-bold mb-1">Min. krok příhozu (Kč)</label>
                                                    <input type="number" value={newAuction.minBidStep} onChange={e => setNewAuction({...newAuction, minBidStep: e.target.value})} className="w-full border p-2.5 rounded-xl" />
                                                </div>
                                            </div>
                                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow text-sm">Publikovat ihned</button>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center">
                                            <h1 className="text-xl font-black">Správa všech aukcí</h1>
                                            <button onClick={() => setSelectedAdminAuction('new')} className="bg-blue-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">＋ Vytvořit novou aukci</button>
                                        </div>

                                        <div className="space-y-3">
                                            {auctions.map(auc => (
                                                <div key={auc.id} className="bg-white border rounded-2xl p-4 flex justify-between items-center shadow-sm">
                                                    <div>
                                                        <h3 className="font-bold text-slate-900 text-base">{auc.productName}</h3>
                                                        <span className="text-xs text-slate-500">Cena: <strong className="text-emerald-600">{getCurrentHighest(auc).toLocaleString()} Kč</strong></span>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => handleDeleteAuction(auc.id)} className="bg-red-600 text-white text-xs font-bold px-3 py-2 rounded-xl">Smazat trvale</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-6 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl">
                                <h3 className="font-bold text-slate-900">Potvrdit příhoz {pendingBid.toLocaleString()} Kč?</h3>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 bg-slate-200 py-2.5 rounded-xl font-bold text-xs">Zrušit</button>
                                    <button onClick={confirmBid} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold text-xs shadow">Potvrdit</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
