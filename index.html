<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aukce Duo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(() => {
                const saved = localStorage.getItem('ad_session');
                return saved ? JSON.parse(saved) : null;
            });
            const [isAdmin, setIsAdmin] = React.useState(() => {
                return localStorage.getItem('ad_auth') === 'true';
            });
            
            const [view, setView] = React.useState('home');
            const [selectedAuctionId, setSelectedAuctionId] = React.useState(null);

            const [regForm, setRegForm] = React.useState({ firstName: '', lastName: '', phone: '' });
            const [loginForm, setLoginForm] = React.useState({ lastName: '', phone: '' });
            
            const [adminPassword, setAdminPassword] = React.useState('');
            const [adminLoginError, setAdminLoginError] = React.useState(false);

            const [auctions, setAuctions] = React.useState(() => {
                const saved = localStorage.getItem('ad_auctions');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: 'duo-1',
                        title: 'Mistrovské orchestrální bubny / bicí souprava',
                        productName: 'Profesionální koncertní bicí nástroj',
                        description: 'Špičková sada určená pro náročné hudebníky a orchestry. Perfektní rezonance, prémiové zpracování a zaručená dlouhá životnost.',
                        imageUrl: 'https://images.unsplash.com/photo-1519892300165-cb5542fb47c7?auto=format&fit=crop&w=800&q=80',
                        startPrice: 15000,
                        minBid: 500,
                        endTime: new Date(Date.now() + 3600 * 1000 * 2).toISOString(),
                        status: 'active',
                        bids: [
                            { id: 1, firstName: 'David', amount: 16000, time: new Date(Date.now() - 1000 * 60 * 15).toLocaleTimeString() },
                            { id: 2, firstName: 'Petr', amount: 17500, time: new Date(Date.now() - 1000 * 60 * 5).toLocaleTimeString() }
                        ]
                    }
                ];
            });

            const [participants, setParticipants] = React.useState(() => {
                const saved = localStorage.getItem('ad_participants');
                return saved ? JSON.parse(saved) : [
                    { id: 1, firstName: 'David', lastName: 'Novák', phone: '+420123456789' },
                    { id: 2, firstName: 'Petr', lastName: 'Svoboda', phone: '+420987654321' }
                ];
            });

            const [newAuction, setNewAuction] = React.useState({
                title: '',
                productName: '',
                description: '',
                imageUrl: '',
                startPrice: 1000,
                minBid: 100,
                durationMinutes: 60
            });

            const [bidAmount, setBidAmount] = React.useState(100);
            const [customBidInput, setCustomBidInput] = React.useState('');
            const [showConfirmModal, setShowConfirmModal] = React.useState(false);
            const [pendingBid, setPendingBid] = React.useState(0);

            // Okamžitá živá synchronizace napříč okny a zařízeními
            React.useEffect(() => {
                const handleStorageChange = (e) => {
                    if (e.key === 'ad_auctions' && e.newValue) {
                        try {
                            setAuctions(JSON.parse(e.newValue));
                        } catch (err) {}
                    }
                    if (e.key === 'ad_participants' && e.newValue) {
                        try {
                            setParticipants(JSON.parse(e.newValue));
                        } catch (err) {}
                    }
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            React.useEffect(() => {
                localStorage.setItem('ad_session', JSON.stringify(user));
            }, [user]);

            React.useEffect(() => {
                localStorage.setItem('ad_auth', isAdmin);
            }, [isAdmin]);

            React.useEffect(() => {
                localStorage.setItem('ad_auctions', JSON.stringify(auctions));
            }, [auctions]);

            React.useEffect(() => {
                localStorage.setItem('ad_participants', JSON.stringify(participants));
            }, [participants]);

            const handleRegister = (e) => {
                e.preventDefault();
                if (!regForm.firstName || !regForm.lastName || !regForm.phone) {
                    alert('Prosím vyplňte všechna pole.');
                    return;
                }
                const newUser = {
                    id: Date.now(),
                    firstName: regForm.firstName.trim(),
                    lastName: regForm.lastName.trim(),
                    phone: regForm.phone.trim()
                };
                setUser(newUser);
                const updatedParticipants = [...participants];
                if (!updatedParticipants.some(p => p.phone === newUser.phone)) {
                    updatedParticipants.push(newUser);
                    setParticipants(updatedParticipants);
                }
                setView('home');
            };

            const handleLoginExisting = (e) => {
                e.preventDefault();
                const found = participants.find(
                    p => p.lastName.toLowerCase() === loginForm.lastName.trim().toLowerCase() && 
                         p.phone.trim() === loginForm.phone.trim()
                );
                if (found) {
                    setUser(found);
                    setView('home');
                } else {
                    alert('Účastník s tímto příjmením a telefonním číslem nebyl nalezen.');
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'admin123') {
                    setIsAdmin(true);
                    setAdminLoginError(false);
                    setView('admin');
                } else {
                    setAdminLoginError(true);
                }
            };

            const handleCreateAuction = (e) => {
                e.preventDefault();
                const endDate = new Date(Date.now() + newAuction.durationMinutes * 60 * 1000).toISOString();
                const created = {
                    id: 'auc-' + Date.now(),
                    title: newAuction.title,
                    productName: newAuction.productName,
                    description: newAuction.description,
                    imageUrl: newAuction.imageUrl || 'https://images.unsplash.com/photo-1519892300165-cb5542fb47c7?auto=format&fit=crop&w=800&q=80',
                    startPrice: Number(newAuction.startPrice),
                    minBid: Number(newAuction.minBid),
                    endTime: endDate,
                    status: 'active',
                    bids: []
                };
                const updatedAuctions = [created, ...auctions];
                setAuctions(updatedAuctions);
                localStorage.setItem('ad_auctions', JSON.stringify(updatedAuctions));
                setNewAuction({ title: '', productName: '', description: '', imageUrl: '', startPrice: 1000, minBid: 100, durationMinutes: 60 });
                alert('Aukce byla úspěšně vytvořena a spuštěna!');
            };

            const handleEndAuctionEarly = (aucId) => {
                if (confirm('Opravdu chcete tuto aukci okamžitě ukončit?')) {
                    const updated = auctions.map(a => {
                        if (a.id === aucId) {
                            return { ...a, status: 'ended' };
                        }
                        return a;
                    });
                    setAuctions(updated);
                    localStorage.setItem('ad_auctions', JSON.stringify(updated));
                }
            };

            const handlePlaceBidSubmit = (amount) => {
                setPendingBid(amount);
                setShowConfirmModal(true);
            };

            const confirmBid = () => {
                const updated = auctions.map(a => {
                    if (a.id === selectedAuctionId) {
                        const newBidObj = {
                            id: Date.now(),
                            firstName: user.firstName,
                            amount: pendingBid,
                            time: new Date().toLocaleTimeString()
                        };
                        return {
                            ...a,
                            bids: [newBidObj, ...a.bids]
                        };
                    }
                    return a;
                });
                setAuctions(updated);
                localStorage.setItem('ad_auctions', JSON.stringify(updated));
                setShowConfirmModal(false);
                setCustomBidInput('');
            };

            const currentAuction = auctions.find(a => a.id === selectedAuctionId);

            const getCurrentHighest = (auc) => {
                if (!auc.bids || auc.bids.length === 0) return auc.startPrice;
                return Math.max(...auc.bids.map(b => b.amount));
            };

            const getLeaderName = (auc) => {
                if (!auc.bids || auc.bids.length === 0) return 'Zatím nikdo';
                const sorted = [...auc.bids].sort((a,b) => b.amount - a.amount);
                return sorted[0].firstName;
            };

            const DrumsticksLogo = () => (
                <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setView('home'); setSelectedAuctionId(null); }}>
                    <div className="bg-blue-600 p-2 rounded-xl text-white shadow-lg flex items-center justify-center">
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11l-6-6m0 0l-6 6m6-6v12M5 19h14" />
                        </svg>
                    </div>
                    <div>
                        <span className="text-xl font-black tracking-wider text-white">Aukce <span className="text-blue-500">Duo</span></span>
                        <span className="block text-[10px] text-slate-400 tracking-widest uppercase">Soukromé aukce</span>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col bg-slate-900 text-slate-100">
                    <header className="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
                        <DrumsticksLogo />

                        <div className="flex items-center gap-3">
                            {user ? (
                                <div className="text-xs md:text-sm bg-slate-700/60 px-3 py-1.5 rounded-full border border-slate-600">
                                    Přihlášen: <span className="font-bold text-blue-400">{user.firstName} {user.lastName}</span>
                                    <button 
                                        onClick={() => { setUser(null); setIsAdmin(false); setView('home'); }}
                                        className="ml-2 text-red-400 hover:underline font-medium"
                                    >
                                        Odhlásit
                                    </button>
                                </div>
                            ) : null}

                            {!isAdmin ? (
                                <button 
                                    onClick={() => setView('admin-login')}
                                    className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition"
                                >
                                    Admin
                                </button>
                            ) : (
                                <button 
                                    onClick={() => setView('admin')}
                                    className="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg font-bold transition shadow"
                                >
                                    Správa aukcí
                                </button>
                            )}
                        </div>
                    </header>

                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">
                        {view === 'home' && !selectedAuctionId && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-blue-900/40 to-slate-800 p-6 rounded-2xl border border-blue-500/20 shadow-xl">
                                    <h1 className="text-2xl md:text-3xl font-black text-white mb-2">Soukromá online aukce</h1>
                                    <p className="text-slate-300 text-sm leading-relaxed">
                                        Vítejte v exkluzivním prostoru pro neveřejné aukce. Sledujte nabídky v reálném čase a přihazujte přímo ze svého mobilního telefonu nebo počítače.
                                    </p>
                                </div>

                                <h2 className="text-xl font-bold text-white border-b border-slate-800 pb-2">Probíhající a připravené aukce</h2>
                                
                                <div className="grid gap-4 md:grid-cols-2">
                                    {auctions.map(auc => {
                                        const currentPrice = getCurrentHighest(auc);
                                        return (
                                            <div key={auc.id} className="bg-slate-800/90 rounded-2xl border border-slate-700 overflow-hidden shadow-lg flex flex-col justify-between hover:border-blue-500/50 transition">
                                                <div>
                                                    <div className="h-48 overflow-hidden relative">
                                                        <img src={auc.imageUrl} alt={auc.productName} className="w-full h-full object-cover" />
                                                        <span className={`absolute top-3 right-3 text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider ${
                                                            auc.status === 'active' ? 'bg-emerald-500 text-white shadow-lg' : 'bg-amber-500 text-slate-950'
                                                        }`}>
                                                            {auc.status === 'active' ? 'Probíhá' : auc.status === 'preparation' ? 'Připravuje se' : 'Skončila'}
                                                        </span>
                                                    </div>
                                                    <div className="p-4 space-y-2">
                                                        <span className="text-xs text-blue-400 font-semibold">{auc.title}</span>
                                                        <h3 className="text-lg font-bold text-white">{auc.productName}</h3>
                                                        <p className="text-slate-400 text-xs line-clamp-2">{auc.description}</p>
                                                    </div>
                                                </div>

                                                <div className="p-4 bg-slate-900/50 border-t border-slate-700/50 flex items-center justify-between">
                                                    <div>
                                                        <span className="text-[10px] text-slate-400 block uppercase">Aktuální cena</span>
                                                        <span className="text-lg font-black text-emerald-400">{currentPrice.toLocaleString()} Kč</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => {
                                                            if (!user) {
                                                                setView('register');
                                                            } else {
                                                                setSelectedAuctionId(auc.id);
                                                                setView('auction');
                                                            }
                                                        }}
                                                        className="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-4 py-2 rounded-xl transition shadow"
                                                    >
                                                        Vstoupit do aukce →
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {view === 'register' && (
                            <div className="max-w-md mx-auto bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-2xl">
                                <h2 className="text-xl font-bold text-white mb-2">Registrace do aukce</h2>
                                <p className="text-xs text-slate-400 mb-6 leading-relaxed">
                                    Pro účast v aukci a bezpečné přihazování je nutné se nejprve zaregistrovat. 
                                    <br/><br/>
                                    <strong className="text-amber-400 font-semibold">Upozornění:</strong> Přes stránku nejsou prováděny žádné platby ani finanční transakce. Systém slouží výhradně pro snadnější kontaktování zájemce s nejvyšší platnou nabídkou po skončení aukce.
                                </p>

                                <form onSubmit={handleRegister} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 mb-1">Křestní jméno</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={regForm.firstName}
                                            onChange={e => setRegForm({...regForm, firstName: e.target.value})}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500"
                                            placeholder="např. Jan"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 mb-1">Příjmení</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={regForm.lastName}
                                            onChange={e => setRegForm({...regForm, lastName: e.target.value})}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500"
                                            placeholder="např. Novák"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 mb-1">Telefonní číslo</label>
                                        <input 
                                            type="tel" 
                                            required
                                            value={regForm.phone}
                                            onChange={e => setRegForm({...regForm, phone: e.target.value})}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500"
                                            placeholder="+420 123 456 789"
                                        />
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg mt-2"
                                    >
                                        Dokončit registraci a vstoupit
                                    </button>
                                </form>

                                <div className="mt-6 text-center border-t border-slate-700 pt-4">
                                    <button 
                                        onClick={() => setView('login-existing')}
                                        className="text-xs text-blue-400 hover:underline font-medium"
                                    >
                                        Už mám registraci
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'login-existing' && (
                            <div className="max-w-md mx-auto bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-2xl">
                                <h2 className="text-xl font-bold text-white mb-2">Přihlášení do aukce</h2>
                                <p className="text-xs text-slate-400 mb-6">Zadejte své příjmení a telefonní číslo, pod kterým jste se již dříve zaregistrovali.</p>

                                <form onSubmit={handleLoginExisting} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 mb-1">Příjmení</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={loginForm.lastName}
                                            onChange={e => setLoginForm({...loginForm, lastName: e.target.value})}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500"
                                            placeholder="Vaše příjmení"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 mb-1">Telefonní číslo</label>
                                        <input 
                                            type="tel" 
                                            required
                                            value={loginForm.phone}
                                            onChange={e => setLoginForm({...loginForm, phone: e.target.value})}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500"
                                            placeholder="Vaše telefonní číslo"
                                        />
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg mt-2"
                                    >
                                        Přihlásit se
                                    </button>
                                </form>

                                <div className="mt-6 text-center border-t border-slate-700 pt-4">
                                    <button 
                                        onClick={() => setView('register')}
                                        className="text-xs text-slate-400 hover:text-white"
                                    >
                                        ← Zpět na registraci
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'auction' && currentAuction && (
                            <div className="space-y-6">
                                <button 
                                    onClick={() => { setSelectedAuctionId(null); setView('home'); }}
                                    className="text-xs text-slate-400 hover:text-white flex items-center gap-1 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 w-fit"
                                >
                                    ← Zpět na přehled aukcí
                                </button>

                                <div className="grid md:grid-cols-2 gap-6">
                                    <div className="space-y-4">
                                        <div className="rounded-2xl overflow-hidden border border-slate-700 bg-slate-800 shadow-xl">
                                            <img src={currentAuction.imageUrl} alt={currentAuction.productName} className="w-full h-72 object-cover" />
                                        </div>
                                        <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg space-y-3">
                                            <span className="text-xs text-blue-400 font-bold uppercase">{currentAuction.title}</span>
                                            <h1 className="text-xl font-black text-white">{currentAuction.productName}</h1>
                                            <p className="text-slate-300 text-sm leading-relaxed">{currentAuction.description}</p>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                                            <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                                <span className="text-xs text-slate-400 uppercase font-semibold">Stav aukce</span>
                                                <span className="text-xs bg-emerald-500 text-white font-bold px-3 py-1 rounded-full uppercase">
                                                    {currentAuction.status === 'active' ? 'Probíhá živě' : 'Ukončeno'}
                                                </span>
                                            </div>

                                            <div className="text-center py-4 bg-slate-900/60 rounded-xl border border-slate-700/50">
                                                <span className="text-xs text-slate-400 block mb-1 uppercase tracking-wider">Aktuální nejvyšší nabídka</span>
                                                <span className="text-3xl md:text-4xl font-black text-emerald-400">{getCurrentHighest(currentAuction).toLocaleString()} Kč</span>
                                                <span className="block text-xs text-slate-400 mt-2">Vede: <strong className="text-white">{getLeaderName(currentAuction)}</strong></span>
                                            </div>

                                            {currentAuction.status === 'active' ? (
                                                <div className="space-y-4 pt-2">
                                                    <span className="text-xs font-bold text-slate-300 block">Zvolte výši příhozu:</span>
                                                    
                                                    <div className="grid grid-cols-4 gap-2">
                                                        {[100, 500, 1000, 5000].map(val => (
                                                            <button 
                                                                key={val}
                                                                onClick={() => handlePlaceBidSubmit(getCurrentHighest(currentAuction) + val)}
                                                                className="bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs py-2.5 rounded-xl border border-slate-600 transition"
                                                            >
                                                                +{val} Kč
                                                            </button>
                                                        ))}
                                                    </div>

                                                    <div className="space-y-2 bg-slate-900/40 p-4 rounded-xl border border-slate-700/50">
                                                        <div className="flex justify-between text-xs text-slate-400">
                                                            <span>Posuvník příhozu</span>
                                                            <span className="text-emerald-400 font-bold">+{bidAmount} Kč (Celkem: {(getCurrentHighest(currentAuction) + bidAmount).toLocaleString()} Kč)</span>
                                                        </div>
                                                        <input 
                                                            type="range" 
                                                            min="100" 
                                                            max="10000" 
                                                            step="100"
                                                            value={bidAmount}
                                                            onChange={e => setBidAmount(Number(e.target.value))}
                                                            className="w-full accent-blue-500 cursor-pointer"
                                                        />
                                                        <button 
                                                            onClick={() => handlePlaceBidSubmit(getCurrentHighest(currentAuction) + bidAmount)}
                                                            className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-sm transition shadow mt-2"
                                                        >
                                                            Přihodit +{bidAmount} Kč posuvníkem
                                                        </button>
                                                    </div>

                                                    <div className="flex gap-2 pt-2">
                                                        <input 
                                                            type="number"
                                                            placeholder="Vlastní částka celkem..."
                                                            value={customBidInput}
                                                            onChange={e => setCustomBidInput(e.target.value)}
                                                            className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500"
                                                        />
                                                        <button 
                                                            onClick={() => {
                                                                const val = Number(customBidInput);
                                                                const minAllowed = getCurrentHighest(currentAuction) + currentAuction.minBid;
                                                                if (val >= minAllowed) {
                                                                    handlePlaceBidSubmit(val);
                                                                } else {
                                                                    alert(`Minimální platná nabídka musí být alespoň ${minAllowed.toLocaleString()} Kč`);
                                                                }
                                                            }}
                                                            className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition shadow"
                                                        >
                                                            Potvrdit
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="text-center py-6 bg-slate-900/80 rounded-xl border border-slate-700">
                                                    <span className="text-lg font-bold text-amber-400">Aukce byla ukončena</span>
                                                    <p className="text-xs text-slate-400 mt-1">Vítězem se stal: <strong className="text-white">{getLeaderName(currentAuction)}</strong> s částkou <strong className="text-emerald-400">{getCurrentHighest(currentAuction).toLocaleString()} Kč</strong></p>
                                                </div>
                                            )}
                                        </div>

                                        <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-3">
                                            <h3 className="text-sm font-bold text-white uppercase tracking-wider border-b border-slate-700 pb-2">Historie příhozů</h3>
                                            <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                                {currentAuction.bids && currentAuction.bids.length > 0 ? (
                                                    currentAuction.bids.map((b, idx) => (
                                                        <div key={b.id || idx} className={`flex justify-between items-center p-2.5 rounded-xl text-xs ${idx === 0 ? 'bg-emerald-950/40 border border-emerald-500/30' : 'bg-slate-900/50'}`}>
                                                            <div>
                                                                <span className="font-bold text-white">{b.firstName}</span>
                                                                <span className="text-slate-400 ml-2">{b.time}</span>
                                                            </div>
                                                            <span className="font-black text-emerald-400">{b.amount.toLocaleString()} Kč</span>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <p className="text-xs text-slate-400 text-center py-4">Zatím nebyl podán žádný příhoz.</p>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showConfirmModal && (
                            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full shadow-2xl space-y-4 text-center">
                                    <h3 className="text-lg font-bold text-white">Potvrzení příhozu</h3>
                                    <p className="text-sm text-slate-300">
                                        Opravdu chcete nabídnout částku <strong className="text-emerald-400 text-base">{pendingBid.toLocaleString()} Kč</strong>?
                                    </p>
                                    <div className="flex gap-2 pt-2">
                                        <button 
                                            onClick={() => setShowConfirmModal(false)}
                                            className="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-xs transition"
                                        >
                                            Zrušit
                                        </button>
                                        <button 
                                            onClick={confirmBid}
                                            className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow"
                                        >
                                            Odeslat příhoz
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'admin-login' && (
                            <div className="max-w-md mx-auto bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-2xl">
                                <h2 className="text-xl font-bold text-white mb-2">Administrace – Přihlášení</h2>
                                <p className="text-xs text-slate-400 mb-6">Zadejte administrátorské heslo pro přístup ke správě aukcí a údajům účastníků.</p>

                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <div>
                                        <input 
                                            type="password" 
                                            required
                                            placeholder="Admin heslo (výchozí: admin123)"
                                            value={adminPassword}
                                            onChange={e => setAdminPassword(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500"
                                        />
                                        {adminLoginError && <span className="text-xs text-red-400 mt-1 block">Nesprávné heslo.</span>}
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg"
                                    >
                                        Vstoupit do administrace
                                    </button>
                                </form>
                            </div>
                        )}

                        {view === 'admin' && isAdmin && (
                            <div className="space-y-8">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                                    <div>
                                        <h1 className="text-2xl font-black text-white">Administrační panel</h1>
                                        <p className="text-xs text-slate-400">Správa aukcí, produktů a detailů účastníků</p>
                                    </div>
                                    <button 
                                        onClick={() => setView('home')}
                                        className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700"
                                    >
                                        Zpět na web
                                    </button>
                                </div>

                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                                    <h2 className="text-lg font-bold text-white">Vytvořit novou aukci</h2>
                                    <form onSubmit={handleCreateAuction} className="grid md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 mb-1">Název aukce</label>
                                            <input 
                                                type="text" required
                                                value={newAuction.title}
                                                onChange={e => setNewAuction({...newAuction, title: e.target.value})}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm"
                                                placeholder="např. Exkluzivní výprodej"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 mb-1">Název produktu</label>
                                            <input 
                                                type="text" required
                                                value={newAuction.productName}
                                                onChange={e => setNewAuction({...newAuction, productName: e.target.value})}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm"
                                                placeholder="např. Bicí souprava"
                                            />
                                        </div>
                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-semibold text-slate-300 mb-1">Popis produktu</label>
                                            <textarea 
                                                required rows="2"
                                                value={newAuction.description}
                                                onChange={e => setNewAuction({...newAuction, description: e.target.value})}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm"
                                                placeholder="Detailní popis..."
                                            ></textarea>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-300 mb-1">URL adresa fotografie</label>
                                            <input 
                                                type="url"
                                                value={newAuction.imageUrl}
                                                onChange={e => setNewAuction({...newAuction, imageUrl: e.target.value})}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm"
                                                placeholder="https://example.com/image.jpg"
                                            />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 mb-1">Startovací cena (Kč)</label>
                                                <input 
                                                    type="number" required
                                                    value={newAuction.startPrice}
                                                    onChange={e => setNewAuction({...newAuction, startPrice: e.target.value})}
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-300 mb-1">Min. příhoz (Kč)</label>
                                                <input 
                                                    type="number" required
                                                    value={newAuction.minBid}
                                                    onChange={e => setNewAuction({...newAuction, minBid: e.target.value})}
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm"
                                                />
                                            </div>
                                        </div>
                                        <div className="md:col-span-2">
                                            <button 
                                                type="submit"
                                                className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition shadow"
                                            >
                                                Vytvořit a spustit aukci
                                            </button>
                                        </div>
                                    </form>
                                </div>

                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                                    <h2 className="text-lg font-bold text-white">Přehled a správa aukcí</h2>
                                    <div className="space-y-3">
                                        {auctions.map(auc => (
                                            <div key={auc.id} className="bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                                <div>
                                                    <span className="text-xs text-blue-400 font-semibold">{auc.title}</span>
                                                    <h3 className="font-bold text-white text-base">{auc.productName}</h3>
                                                    <span className="text-xs text-slate-400">Aktuální cena: <strong className="text-emerald-400">{getCurrentHighest(auc).toLocaleString()} Kč</strong> | Vede: <strong className="text-white">{getLeaderName(auc)}</strong></span>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    {auc.status === 'active' && (
                                                        <button 
                                                            onClick={() => handleEndAuctionEarly(auc.id)}
                                                            className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-2 rounded-lg transition"
                                                        >
                                                            Ukončit aukci
                                                        </button>
                                                    )}
                                                    <span className={`text-xs font-bold px-2.5 py-1 rounded-full uppercase ${auc.status === 'active' ? 'bg-emerald-500 text-white' : 'bg-slate-700 text-slate-300'}`}>
                                                        {auc.status}
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                                    <h2 className="text-lg font-bold text-white">Seznam účastníků a citlivé kontakty</h2>
                                    <p className="text-xs text-slate-400">Tento seznam vidí výhradně administrátor. Telefonní čísla a celá jména jsou před běžnými účastníky skryta.</p>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs text-slate-300">
                                            <thead className="bg-slate-900 text-slate-400 uppercase text-[10px]">
                                                <tr>
                                                    <th className="p-3">Jméno a příjmení</th>
                                                    <th className="p-3">Telefonní číslo</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-700/50">
                                                {participants.map(p => (
                                                    <tr key={p.id} className="hover:bg-slate-700/20">
                                                        <td className="p-3 font-bold text-white">{p.firstName} {p.lastName}</td>
                                                        <td className="p-3 font-mono text-emerald-400">{p.phone}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-800/40 border-t border-slate-800 text-center py-4 text-xs text-slate-500 mt-auto">
                        Aukce Duo &copy; 2026 — Všechna práva vyhrazena. Žádné platby neprobíhají online.
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
