<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aukce Duo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = 'https://uwfpyjbvgyesxmpzedcs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3ZnB5amJ2Z3llc3htcHplZGNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDA1NzcsImV4cCI6MjEwODE3NjU3N30.Cm4SM1Y1C2XKO-HGCYsbJYfknyHntyWD-BfCmkx5x7o';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const toYMD = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        const toHM = (date) => `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;

        function App() {
            const [user, setUser] = React.useState(() => {
                const saved = localStorage.getItem('ad_session_v5');
                return saved ? JSON.parse(saved) : null;
            });
            const [isAdmin, setIsAdmin] = React.useState(() => {
                return localStorage.getItem('ad_auth_v5') === 'true';
            });
            
            const [view, setView] = React.useState('home');
            const [selectedAuctionId, setSelectedAuctionId] = React.useState(null);
            const [selectedAdminAuction, setSelectedAdminAuction] = React.useState(null);

            const [showAdminLoginBox, setShowAdminLoginBox] = React.useState(false);
            const [showAuthMenu, setShowAuthMenu] = React.useState(false);

            const [regForm, setRegForm] = React.useState({ firstName: '', lastName: '', phone: '' });
            const [loginForm, setLoginForm] = React.useState({ lastName: '', phone: '' });
            
            const [adminUser, setAdminUser] = React.useState('');
            const [adminPassword, setAdminPassword] = React.useState('');
            const [adminLoginError, setAdminLoginError] = React.useState(false);

            const [now, setNow] = React.useState(Date.now());
            React.useEffect(() => {
                const interval = setInterval(() => setNow(Date.now()), 1000);
                return () => clearInterval(interval);
            }, []);

            const [auctions, setAuctions] = React.useState([]);
            const [participants, setParticipants] = React.useState([]);

            const loadDataFromSupabase = async () => {
                try {
                    const { data: aucData } = await supabase
                        .from('auctions')
                        .select('*')
                        .order('created_at', { ascending: false });

                    const { data: bidData } = await supabase
                        .from('bids')
                        .select('*, participants(first_name, last_name, phone)');

                    if (aucData) {
                        const formattedAuctions = aucData.map(a => {
                            const aucBids = (bidData || [])
                                .filter(b => b.auction_id === a.id)
                                .map(b => ({
                                    id: b.id,
                                    participantId: b.participant_id,
                                    firstName: b.participants ? b.participants.first_name : 'Neznámý',
                                    lastName: b.participants ? b.participants.last_name : '',
                                    phone: b.participants ? b.participants.phone : '',
                                    amount: Number(b.amount),
                                    time: new Date(b.created_at).toLocaleTimeString()
                                }))
                                .sort((x, y) => y.amount - x.amount);

                            return {
                                id: a.id,
                                title: a.title,
                                productName: a.product_name || a.title,
                                description: a.description,
                                imageUrl: a.image_url,
                                startPrice: Number(a.starting_price),
                                startTime: a.start_time,
                                endTime: a.ends_at,
                                forceEnded: a.status === 'ended',
                                isDraft: a.status === 'draft',
                                bids: aucBids
                            };
                        });
                        setAuctions(formattedAuctions);
                    }

                    if (isAdmin) {
                        const { data: partData } = await supabase.from('participants').select('*');
                        if (partData) {
                            setParticipants(partData.map(p => ({
                                id: p.id,
                                firstName: p.first_name,
                                lastName: p.last_name,
                                phone: p.phone
                            })));
                        }
                    }
                } catch (err) {
                    console.error('Chyba při načítání:', err);
                }
            };

            React.useEffect(() => {
                loadDataFromSupabase();
                const channel = supabase.channel('realtime-auctions')
                    .on('postgres_changes', { event: '*', schema: 'public' }, () => {
                        loadDataFromSupabase();
                    })
                    .subscribe();

                return () => { supabase.removeChannel(channel); };
            }, [isAdmin]);

            const today = new Date();
            const tomorrow = new Date(Date.now() + 86400000);

            const [newAuction, setNewAuction] = React.useState({
                title: '',
                productName: '',
                description: '',
                imageUrl: '',
                startPrice: 1000,
                startDate: toYMD(today),
                startTime: toHM(today),
                endDate: toYMD(tomorrow),
                endTime: toHM(tomorrow)
            });

            const [submitAction, setSubmitAction] = React.useState('publish');
            
            // Stav pro kruhový posuvník / rotátor příhozů
            const [bidSliderOffset, setBidSliderOffset] = React.useState(0);
            const [customBidInput, setCustomBidInput] = React.useState('');
            const [showConfirmModal, setShowConfirmModal] = React.useState(false);
            const [pendingBid, setPendingBid] = React.useState(0);

            React.useEffect(() => { localStorage.setItem('ad_session_v5', JSON.stringify(user)); }, [user]);
            React.useEffect(() => { localStorage.setItem('ad_auth_v5', isAdmin); }, [isAdmin]);

            const handleAdminLogin = async (e) => {
                e.preventDefault();
                const targetPass = String.fromCharCode(64, 100, 109, 105, 110, 49);
                if (adminUser.trim() === 'Zvolanek1' && adminPassword === targetPass) {
                    setUser(null); setIsAdmin(true); setAdminLoginError(false); setView('admin');
                } else { setAdminLoginError(true); }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!regForm.firstName || !regForm.lastName || !regForm.phone) return;
                const participantId = 'part-' + Date.now();
                const newUser = { 
                    id: participantId, 
                    first_name: regForm.firstName.trim(), 
                    last_name: regForm.lastName.trim(), 
                    phone: regForm.phone.trim() 
                };

                await supabase.from('participants').insert([newUser]);
                setUser({ id: participantId, firstName: newUser.first_name, lastName: newUser.last_name, phone: newUser.phone });
                setIsAdmin(false);
                setView('home');
            };

            const handleLoginExisting = async (e) => {
                e.preventDefault();
                const { data } = await supabase
                    .from('participants')
                    .select('*')
                    .ilike('last_name', loginForm.lastName.trim())
                    .eq('phone', loginForm.phone.trim());

                if (data && data.length > 0) {
                    const found = data[0];
                    setUser({ id: found.id, firstName: found.first_name, lastName: found.last_name, phone: found.phone });
                    setIsAdmin(false); 
                    setView('home');
                } else { 
                    alert('Účastník nebyl nalezen.'); 
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let scale = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        setNewAuction({...newAuction, imageUrl: canvas.toDataURL('image/jpeg', 0.8)});
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleCreateAuction = async (e) => {
                e.preventDefault();
                const startStr = `${newAuction.startDate}T${newAuction.startTime}`;
                const endStr = `${newAuction.endDate}T${newAuction.endTime}`;
                
                const dbAuction = {
                    id: 'auc-' + Date.now(),
                    title: newAuction.title,
                    product_name: newAuction.productName,
                    description: newAuction.description,
                    image_url: newAuction.imageUrl || '',
                    starting_price: Number(newAuction.startPrice),
                    current_price: Number(newAuction.startPrice),
                    start_time: new Date(startStr).toISOString(),
                    ends_at: new Date(endStr).toISOString(),
                    status: submitAction === 'draft' ? 'draft' : 'active'
                };

                await supabase.from('auctions').insert([dbAuction]);
                setNewAuction({ title: '', productName: '', description: '', imageUrl: '', startPrice: 1000, startDate: toYMD(today), startTime: toHM(today), endDate: toYMD(tomorrow), endTime: toHM(tomorrow) });
                loadDataFromSupabase();
                setSelectedAdminAuction(null);
                setView('admin');
            };

            const handlePublishDraft = async (aucId) => {
                await supabase.from('auctions').update({ status: 'active' }).eq('id', aucId);
                loadDataFromSupabase();
            };

            const handleEndAuctionEarly = async (aucId) => {
                if (confirm('Opravdu chcete tuto aukci ukončit?')) {
                    await supabase.from('auctions').update({ status: 'ended' }).eq('id', aucId);
                    loadDataFromSupabase();
                }
            };

            const getAuctionStatus = (auc) => {
                if (auc.isDraft) return 'draft';
                if (auc.forceEnded) return 'ended';
                const start = new Date(auc.startTime).getTime();
                const end = new Date(auc.endTime).getTime();
                if (now < start) return 'scheduled';
                if (now >= start && now < end) return 'active';
                return 'ended';
            };

            const confirmBid = async () => {
                if (!user) return;
                const newBid = {
                    id: 'bid-' + Date.now(),
                    auction_id: selectedAuctionId,
                    participant_id: user.id,
                    amount: pendingBid
                };

                await supabase.from('bids').insert([newBid]);
                await supabase.from('auctions').update({ current_price: pendingBid }).eq('id', selectedAuctionId);

                setShowConfirmModal(false);
                setCustomBidInput('');
                setBidSliderOffset(0);
                loadDataFromSupabase();
            };

            const currentAuction = auctions.find(a => a.id === selectedAuctionId);
            const getCurrentHighest = (auc) => (!auc.bids || auc.bids.length === 0) ? auc.startPrice : Math.max(...auc.bids.map(b => b.amount));

            // Zjištění, zda aktuální přihlášený uživatel vede aukci
            const isUserWinning = (auc) => {
                if (!user || !auc.bids || auc.bids.length === 0) return false;
                const highestBid = auc.bids[0]; // Seřazené sestupně
                return highestBid.participantId === user.id;
            };

            // Výpočet navýšení z kruhového slideru (0 až 100% posunu = navýšení 0 až 50 000 Kč)
            const calculatedBidAmount = currentAuction ? getCurrentHighest(currentAuction) + Number(bidSliderOffset) * 100 : 0;

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans antialiased pb-24 relative">
                    <header className="bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setView('home'); setSelectedAuctionId(null); setSelectedAdminAuction(null); }}>
                            <div className="bg-blue-600 p-2 rounded-xl text-white shadow-md">
                                <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none"><rect x="4" y="13" width="4" height="7" rx="1" fill="currentColor" /><rect x="10" y="9" width="4" height="11" rx="1" fill="currentColor" /><rect x="16" y="4" width="4" height="16" rx="1" fill="currentColor" /></svg>
                            </div>
                            <div>
                                <span className="text-xl font-black text-slate-900"><span className="text-blue-600">i</span>aukce</span>
                                <span className="block text-[10px] text-slate-500 uppercase font-semibold">Live aukce Duo</span>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            {isAdmin ? (
                                <div className="text-xs bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-200">
                                    Admin <button onClick={() => { setIsAdmin(false); setView('home'); }} className="ml-2 text-red-500 font-bold">Odhlásit</button>
                                </div>
                            ) : user ? (
                                <div className="text-xs bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200">
                                    {user.firstName} {user.lastName} <button onClick={() => { setUser(null); setView('home'); }} className="ml-2 text-red-500 font-bold">Odhlásit</button>
                                </div>
                            ) : (
                                <button onClick={() => setShowAuthMenu(!showAuthMenu)} className="text-sm bg-blue-600 text-white font-bold px-4 py-2 rounded-xl shadow">Přihlášení</button>
                            )}
                            
                            {showAuthMenu && !user && !isAdmin && (
                                <div className="absolute right-4 top-16 w-72 bg-white rounded-xl border border-slate-200 shadow-xl p-3 z-50 text-left space-y-3">
                                    <button onClick={() => { setView('register'); setShowAuthMenu(false); }} className="w-full bg-blue-600 text-white font-bold text-sm py-2 rounded-lg">Registrace účastníka</button>
                                    <form onSubmit={handleLoginExisting} className="space-y-2 border-t pt-2">
                                        <input type="text" placeholder="Příjmení" value={loginForm.lastName} onChange={e => setLoginForm({...loginForm, lastName: e.target.value})} className="w-full border rounded p-2 text-sm" />
                                        <input type="tel" placeholder="Telefon" value={loginForm.phone} onChange={e => setLoginForm({...loginForm, phone: e.target.value})} className="w-full border rounded p-2 text-sm" />
                                        <button type="submit" className="w-full bg-slate-800 text-white font-bold py-2 rounded text-sm">Přihlásit se</button>
                                    </form>
                                    <div className="border-t pt-2">
                                        <button onClick={() => setShowAdminLoginBox(!showAdminLoginBox)} className="text-xs text-slate-500 font-semibold">Přihlášení administrátora</button>
                                        {showAdminLoginBox && (
                                            <form onSubmit={handleAdminLogin} className="mt-2 space-y-2">
                                                <input type="text" placeholder="Admin jméno" value={adminUser} onChange={e => setAdminUser(e.target.value)} className="w-full border rounded p-1 text-sm" />
                                                <input type="password" placeholder="Heslo" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} className="w-full border rounded p-1 text-sm" />
                                                {adminLoginError && <span className="text-xs text-red-600">Chyba</span>}
                                                <button type="submit" className="w-full bg-blue-600 text-white py-1 rounded text-sm">Vstoupit jako Admin</button>
                                            </form>
                                        )}
                                    </div>
                                </div>
                            )}
                            {isAdmin && <button onClick={() => { setView('admin'); setSelectedAdminAuction(null); }} className="text-sm bg-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow">Správa</button>}
                        </div>
                    </header>

                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">
                        {view === 'home' && !selectedAuctionId && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-6 md:p-8 rounded-2xl shadow-lg">
                                    <h1 className="text-2xl md:text-3xl font-black mb-2">Vítejte na aukci iPhone Duo</h1>
                                    <p className="text-blue-100 text-sm leading-relaxed">
                                        Tuto stránku jsem vytvořil, abych urychlil a zjednodušil hledání zájemců o předobjednávku iPhonu.
                                    </p>
                                    <p className="text-blue-100 text-sm leading-relaxed mt-3">
                                        Máte-li zájem o předobjednávku, přihlaste se prosím svým jménem a telefonním číslem, abych vás / výherce aukce mohl kontaktovat. Děkuji a těším se na vás!
                                    </p>
                                </div>

                                <h2 className="text-xl font-bold text-slate-900 border-b border-slate-200 pb-2">Probíhající aukce</h2>
                                <div className="grid gap-6 md:grid-cols-2">
                                    {auctions.filter(a => !a.isDraft).map(auc => {
                                        const currentPrice = getCurrentHighest(auc);
                                        return (
                                            <div key={auc.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-md flex flex-col justify-between">
                                                <div className="p-5 space-y-2">
                                                    <span className="text-xs text-blue-600 font-bold uppercase">{auc.title}</span>
                                                    <h3 className="text-lg font-bold text-slate-900">{auc.productName}</h3>
                                                    <span className="text-2xl font-black text-emerald-600 mt-2 block">{currentPrice.toLocaleString()} Kč</span>
                                                </div>
                                                <div className="p-4 bg-slate-50 border-t flex justify-end">
                                                    <button onClick={() => { if (!user && !isAdmin) setView('register'); else { setSelectedAuctionId(auc.id); setView('auction'); } }} className="bg-blue-600 text-white text-sm font-bold px-5 py-2.5 rounded-xl shadow hover:bg-blue-500 transition">Vstoupit →</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {view === 'register' && (
                            <div className="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-xl space-y-4">
                                <h2 className="text-2xl font-bold">Registrace účastníka</h2>
                                <form onSubmit={handleRegister} className="space-y-3">
                                    <input type="text" required placeholder="Křestní jméno" value={regForm.firstName} onChange={e => setRegForm({...regForm, firstName: e.target.value})} className="w-full border p-3 rounded-xl" />
                                    <input type="text" required placeholder="Příjmení" value={regForm.lastName} onChange={e => setRegForm({...regForm, lastName: e.target.value})} className="w-full border p-3 rounded-xl" />
                                    <input type="tel" required placeholder="Telefonní číslo" value={regForm.phone} onChange={e => setRegForm({...regForm, phone: e.target.value})} className="w-full border p-3 rounded-xl" />
                                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Dokončit registraci</button>
                                </form>
                                <button onClick={() => setView('home')} className="w-full text-xs text-slate-500 font-semibold text-center mt-2">Zpět na hlavní stranu</button>
                            </div>
                        )}

                        {view === 'auction' && currentAuction && (
                            <div className="space-y-6 bg-white p-6 md:p-8 rounded-2xl shadow-xl">
                                <button onClick={() => { setSelectedAuctionId(null); setView('home'); }} className="text-blue-600 font-bold text-sm">← Zpět na seznam aukcí</button>
                                
                                <div className="flex flex-col md:flex-row justify-between items-start gap-4 border-b pb-6">
                                    <div>
                                        <span className="text-xs text-blue-600 font-bold uppercase">{currentAuction.title}</span>
                                        <h1 className="text-2xl md:text-3xl font-black text-slate-900">{currentAuction.productName}</h1>
                                        <p className="text-xs text-slate-500 mt-1">{currentAuction.description}</p>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-xs text-slate-400 block uppercase font-bold">Aktuální cena</span>
                                        <span className="text-3xl font-black text-emerald-600">{getCurrentHighest(currentAuction).toLocaleString()} Kč</span>
                                    </div>
                                </div>

                                {/* MODERNÍ PROFESIONÁLNÍ ROZHRANÍ PRO PŘÍHOZ */}
                                <div className={`p-6 rounded-2xl border transition-all shadow-inner space-y-6 text-center ${
                                    isUserWinning(currentAuction) ? 'bg-emerald-50/70 border-emerald-300' : 'bg-slate-100 border-slate-200'
                                }`}>
                                    <div>
                                        {isUserWinning(currentAuction) ? (
                                            <span className="inline-block bg-emerald-600 text-white text-xs font-black uppercase px-3 py-1 rounded-full animate-pulse shadow">
                                                ✓ Vedeš tuto aukci!
                                            </span>
                                        ) : (
                                            <span className="inline-block bg-rose-600 text-white text-xs font-black uppercase px-3 py-1 rounded-full shadow">
                                                ▲ Někdo te přebil – přihod víc!
                                            </span>
                                        )}
                                    </div>

                                    {/* Kruhové/posuvné rozhraní (Dial / Slider) */}
                                    <div className="flex flex-col items-center space-y-3">
                                        <div className="w-48 h-48 rounded-full border-8 border-white bg-gradient-to-tr from-blue-700 to-indigo-600 shadow-xl flex flex-col items-center justify-center text-white relative select-none">
                                            <span className="text-[10px] uppercase font-bold tracking-widest text-blue-200">Tvůj příhoz</span>
                                            <span className="text-2xl font-black">{calculatedBidAmount.toLocaleString()}</span>
                                            <span className="text-[10px] text-blue-200">Kč</span>
                                        </div>

                                        <div className="w-full max-w-xs space-y-1">
                                            <div className="flex justify-between text-xs text-slate-500 font-semibold">
                                                <span>Min (+0 Kč)</span>
                                                <span>Max (+50 000 Kč)</span>
                                            </div>
                                            <input 
                                                type="range" 
                                                min="0" 
                                                max="500" 
                                                value={bidSliderOffset} 
                                                onChange={e => setBidSliderOffset(e.target.value)} 
                                                className="w-full accent-blue-600 cursor-pointer h-2 bg-slate-300 rounded-lg" 
                                            />
                                        </div>
                                    </div>

                                    {/* Ruční přepsání částky */}
                                    <div className="flex gap-2 max-w-sm mx-auto pt-2">
                                        <input 
                                            type="number" 
                                            placeholder="Nebo vepiš vlastní částku..." 
                                            value={customBidInput} 
                                            onChange={e => setCustomBidInput(e.target.value)} 
                                            className="bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-sm flex-1 text-slate-900 shadow-sm" 
                                        />
                                        <button 
                                            onClick={() => {
                                                const val = Number(customBidInput);
                                                const current = getCurrentHighest(currentAuction);
                                                if (!val || val <= current) {
                                                    alert(`Příhoz musí být vyšší než aktuální cena (${current.toLocaleString()} Kč).`);
                                                    return;
                                                }
                                                setPendingBid(val);
                                                setShowConfirmModal(true);
                                            }} 
                                            className="bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow transition"
                                        >
                                            Vepsat
                                        </button>
                                    </div>

                                    {/* Hlavní potvrzovací posuvné/kruhové tlačítko */}
                                    <button 
                                        onClick={() => {
                                            setPendingBid(calculatedBidAmount);
                                            setShowConfirmModal(true);
                                        }}
                                        className="w-full max-w-sm bg-emerald-600 hover:bg-emerald-500 text-white font-black text-lg py-4 rounded-2xl shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2"
                                    >
                                        <span>Potvrdit příhoz {calculatedBidAmount.toLocaleString()} Kč</span>
                                    </button>
                                </div>

                                <div className="border-t pt-4 space-y-3">
                                    <h3 className="font-bold text-slate-900 text-sm">Živá historie příhozů</h3>
                                    {currentAuction.bids.length === 0 ? (
                                        <p className="text-slate-400 text-xs italic">Zatím nepadnul žádný příhoz.</p>
                                    ) : (
                                        <div className="space-y-2 max-h-48 overflow-y-auto">
                                            {currentAuction.bids.map((b, i) => (
                                                <div key={i} className="flex justify-between items-center border-b pb-2 text-sm">
                                                    <span className="font-bold">{b.firstName} <span className="text-xs text-slate-400">({b.time})</span></span>
                                                    <strong className="text-emerald-600">{b.amount.toLocaleString()} Kč</strong>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'admin' && isAdmin && (
                            <div className="space-y-6">
                                {selectedAdminAuction === 'new' ? (
                                    <div className="bg-white p-6 rounded-2xl shadow space-y-4">
                                        <div className="flex justify-between items-center">
                                            <h2 className="text-lg font-bold">Nová aukce</h2>
                                            <button onClick={() => setSelectedAdminAuction(null)} className="text-xs text-slate-500">Zpět</button>
                                        </div>
                                        <form onSubmit={handleCreateAuction} className="space-y-3">
                                            <input type="text" placeholder="Nadpis" value={newAuction.title} onChange={e => setNewAuction({...newAuction, title: e.target.value})} className="w-full border p-2 rounded" />
                                            <input type="text" placeholder="Název produktu" value={newAuction.productName} onChange={e => setNewAuction({...newAuction, productName: e.target.value})} className="w-full border p-2 rounded" />
                                            <input type="number" placeholder="Vyvolávací cena" value={newAuction.startPrice} onChange={e => setNewAuction({...newAuction, startPrice: e.target.value})} className="w-full border p-2 rounded" />
                                            <button type="submit" className="bg-blue-600 text-white font-bold px-4 py-2 rounded">Vytvořit</button>
                                        </form>
                                    </div>
                                ) : selectedAdminAuction && typeof selectedAdminAuction === 'object' ? (
                                    <div className="bg-white p-6 rounded-2xl shadow space-y-4">
                                        <button onClick={() => setSelectedAdminAuction(null)} className="text-blue-600 font-bold text-sm">← Zpět na seznam aukcí</button>
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <span className="text-xs text-blue-600 font-bold uppercase">{selectedAdminAuction.title}</span>
                                                <h2 className="text-2xl font-black">{selectedAdminAuction.productName}</h2>
                                            </div>
                                            <span className="text-2xl font-black text-emerald-600">{getCurrentHighest(selectedAdminAuction).toLocaleString()} Kč</span>
                                        </div>

                                        <div className="border-t pt-4 space-y-3">
                                            <h3 className="font-bold text-slate-900">Historie příhozů s kontakty na výherce:</h3>
                                            {selectedAdminAuction.bids.length === 0 ? (
                                                <p className="text-slate-500 text-sm">Zatím nikdo nepřihodil.</p>
                                            ) : (
                                                <div className="space-y-2">
                                                    {selectedAdminAuction.bids.map((b, idx) => (
                                                        <div key={idx} className="flex justify-between items-center bg-slate-50 border p-3 rounded-xl text-xs">
                                                            <div>
                                                                <span className="font-bold text-slate-900 text-sm">{b.firstName} {b.lastName}</span>
                                                                <span className="text-blue-600 font-semibold ml-2">({b.phone})</span>
                                                                <span className="text-slate-400 ml-2">{b.time}</span>
                                                            </div>
                                                            <strong className="text-emerald-600 text-base">{b.amount.toLocaleString()} Kč</strong>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center">
                                            <h1 className="text-xl font-black">Správa aukcí</h1>
                                            <button onClick={() => setSelectedAdminAuction('new')} className="bg-blue-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">＋ Vytvořit novou aukci</button>
                                        </div>

                                        <div className="space-y-3">
                                            <h2 className="font-bold text-slate-900">Aukce v systému</h2>
                                            {auctions.map(auc => (
                                                <div key={auc.id} className="bg-white border rounded-2xl p-4 flex justify-between items-center shadow-sm">
                                                    <div>
                                                        <h3 className="font-bold text-slate-900">{auc.productName}</h3>
                                                        <span className="text-xs text-slate-500">Cena: <strong className="text-emerald-600">{getCurrentHighest(auc).toLocaleString()} Kč</strong> ({auc.bids.length} příhozů)</span>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => setSelectedAdminAuction(auc)} className="bg-slate-900 text-white text-xs font-bold px-3 py-2 rounded-xl">Detail & Kontakty</button>
                                                        {!auc.forceEnded && !auc.isDraft && (
                                                            <button onClick={() => handleEndAuctionEarly(auc.id)} className="bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl">Ukončit</button>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="border-t pt-6 space-y-3">
                                            <h2 className="font-bold text-slate-900">Registrovaní účastníci</h2>
                                            <div className="bg-white border rounded-2xl overflow-hidden shadow-sm">
                                                <table className="w-full text-left text-xs">
                                                    <thead>
                                                        <tr className="bg-slate-50 border-b text-slate-500 font-bold uppercase">
                                                            <th className="p-3">Jméno a příjmení</th>
                                                            <th className="p-3">Telefonní číslo</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {participants.map(p => (
                                                            <tr key={p.id} className="border-b hover:bg-slate-50">
                                                                <td className="p-3 font-bold text-slate-900">{p.firstName} {p.lastName}</td>
                                                                <td className="p-3 text-blue-600 font-semibold">{p.phone}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-6 rounded-2xl max-w-sm w-full text-center space-y-4 shadow-2xl">
                                <h3 className="font-bold">Potvrdit příhoz {pendingBid.toLocaleString()} Kč?</h3>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 bg-slate-200 py-2 rounded-xl">Zrušit</button>
                                    <button onClick={confirmBid} className="flex-1 bg-blue-600 text-white py-2 rounded-xl font-bold">Potvrdit</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
