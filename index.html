<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iAukce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = "https://uwfpyjbvgyesxmpzedcs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_44EjLS-r5zu7hEVK6ZZO9A_a28zzo01";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const toYMD = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        const toHM = (date) => `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;

        function App() {
            const [user, setUser] = React.useState(() => {
                const saved = localStorage.getItem('iaukce_session');
                return saved ? JSON.parse(saved) : null;
            });
            const [isAdmin, setIsAdmin] = React.useState(() => {
                return localStorage.getItem('iaukce_auth') === 'true';
            });
            
            const [view, setView] = React.useState('home');
            const [selectedAuctionId, setSelectedAuctionId] = React.useState(null);
            const [selectedAdminAuction, setSelectedAdminAuction] = React.useState(null);

            const [footerVisible, setFooterVisible] = React.useState(true);
            const [showAdminLoginBox, setShowAdminLoginBox] = React.useState(false);
            const [showAuthMenu, setShowAuthMenu] = React.useState(false);

            const [regForm, setRegForm] = React.useState({ firstName: '', lastName: '', phone: '' });
            const [loginForm, setLoginForm] = React.useState({ lastName: '', phone: '' });
            
            const [adminUser, setAdminUser] = React.useState('');
            const [adminPassword, setAdminPassword] = React.useState('');
            const [adminLoginError, setAdminLoginError] = React.useState(false);

            const [now, setNow] = React.useState(Date.now());
            React.useEffect(() => {
                const interval = setInterval(() => setNow(Date.now()), 1000);
                return () => clearInterval(interval);
            }, []);

            const [auctions, setAuctions] = React.useState([]);
            const [participants, setParticipants] = React.useState([]);
            const [dataLoaded, setDataLoaded] = React.useState(false);
            
            const [presenceCounts, setPresenceCounts] = React.useState({});
            const [clientSessionId] = React.useState(() => 'client_' + Math.random().toString(36).substring(2, 9));

            const [activeImageIndex, setActiveImageIndex] = React.useState(0);

            const fetchData = async () => {
                try {
                    const { data: aucData, error: aucErr } = await supabase.from('auctions').select('*');
                    if (aucErr) console.error("Chyba aukcí:", aucErr);
                    if (aucData) {
                        const formattedAuctions = aucData.map(a => {
                            let images = [];
                            if (a.image_urls && Array.isArray(a.image_urls)) {
                                images = a.image_urls;
                            } else if (a.image_url) {
                                images = [a.image_url];
                            } else if (a.imageUrl) {
                                images = [a.imageUrl];
                            }

                            return {
                                id: a.id,
                                title: a.title || 'iPhone Aukce',
                                productName: a.product_name || a.productName || 'iPhone',
                                description: a.description || '',
                                imageUrls: images,
                                priceLabel: a.price_label || a.priceLabel || 'Aktuální cena',
                                startPrice: Number(a.starting_price || a.start_price || a.startPrice || 1000),
                                minBidStep: Number(a.min_bid_step || a.minBidStep || 100),
                                autoExtendMinutes: Number(a.auto_extend_minutes || a.autoExtendMinutes || 0),
                                startTime: a.start_time || a.created_at || new Date().toISOString(),
                                endTime: a.ends_at || a.end_time || a.endTime || new Date(Date.now() + 86400000).toISOString(),
                                forceEnded: a.force_ended || (a.status === 'ended'),
                                bids: a.bids || []
                            };
                        });
                        setAuctions(formattedAuctions);
                    }

                    const { data: partData, error: partErr } = await supabase.from('participants').select('*');
                    if (partErr) console.error("Chyba účastníků:", partErr);
                    if (partData) {
                        const formattedParticipants = partData.map(p => ({
                            id: p.id,
                            firstName: p.first_name || p.firstName || '',
                            lastName: p.last_name || p.lastName || '',
                            phone: p.phone || '',
                            blocked: p.blocked || false
                        }));
                        setParticipants(formattedParticipants);
                        setDataLoaded(true);
                    }
                } catch (err) {
                    console.error("Chyba načítání:", err);
                }
            };

            React.useEffect(() => {
                if (dataLoaded && user && !isAdmin) {
                    const myRecord = participants.find(p => p.phone === user.phone);
                    
                    if (!myRecord) {
                        alert('Váš účet byl odstraněn administrátorem. Byli jste odhlášeni ze systému.');
                        setUser(null);
                        setView('home');
                        setSelectedAuctionId(null);
                    } else if (myRecord.blocked) {
                        alert('Váš účet byl zablokován administrátorem z důvodu porušení pravidel. Byli jste odhlášeni.');
                        setUser(null);
                        setView('home');
                        setSelectedAuctionId(null);
                    }
                }
            }, [participants, dataLoaded, user, isAdmin]);

            React.useEffect(() => {
                fetchData();
                const dbChannel = supabase.channel('db_changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'auctions' }, () => fetchData())
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'participants' }, () => fetchData())
                    .subscribe();

                return () => {
                    supabase.removeChannel(dbChannel);
                };
            }, []);

            React.useEffect(() => {
                const globalPresenceChannel = supabase.channel('global_live_viewers', {
                    config: { presence: { key: clientSessionId } }
                });

                globalPresenceChannel.on('presence', { event: 'sync' }, () => {
                    const state = globalPresenceChannel.presenceState();
                    const newCounts = {};
                    
                    Object.values(state).forEach(presences => {
                        presences.forEach(p => {
                            if (p.auctionId) {
                                newCounts[p.auctionId] = (newCounts[p.auctionId] || 0) + 1;
                            }
                        });
                    });
                    setPresenceCounts(newCounts);
                });

                globalPresenceChannel.subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        window.globalPresenceChannel = globalPresenceChannel;
                        window.dispatchEvent(new Event('presence_ready'));
                    }
                });

                return () => {
                    globalPresenceChannel.untrack();
                    supabase.removeChannel(globalPresenceChannel);
                    window.globalPresenceChannel = null;
                };
            }, [clientSessionId]);

            React.useEffect(() => {
                const updateMyPresence = async () => {
                    const channel = window.globalPresenceChannel;
                    if (channel && channel.state === 'joined') {
                        if (view === 'auction' && selectedAuctionId && !isAdmin) {
                            await channel.track({ auctionId: selectedAuctionId, onlineAt: new Date().toISOString() });
                        } else {
                            await channel.track({ auctionId: null });
                        }
                    }
                };

                updateMyPresence();
                window.addEventListener('presence_ready', updateMyPresence);
                return () => window.removeEventListener('presence_ready', updateMyPresence);
            }, [view, selectedAuctionId, isAdmin]);


            const today = new Date();
            const tomorrow = new Date(Date.now() + 86400000);

            const [newAuction, setNewAuction] = React.useState({
                title: 'iPhone Aukce',
                productName: '',
                description: '',
                imageUrls: [],
                priceLabel: 'Aktuální cena',
                startPrice: 1000,
                minBidStep: 100,
                autoExtendMinutes: 2,
                startDate: toYMD(today),
                startTime: toHM(today),
                endDate: toYMD(tomorrow),
                endTime: toHM(tomorrow)
            });

            const [editingAuctionId, setEditingAuctionId] = React.useState(null);
            const [editForm, setEditForm] = React.useState({ 
                title: '', productName: '', description: '', imageUrls: [], priceLabel: 'Aktuální cena',
                startPrice: 1000, minBidStep: 100, autoExtendMinutes: 2,
                startDate: '', startTime: '', endDate: '', endTime: '' 
            });

            const [editingPartId, setEditingPartId] = React.useState(null);
            const [partEditForm, setPartEditForm] = React.useState({ firstName: '', lastName: '', phone: '' });

            const [bidAmountInput, setBidAmountInput] = React.useState('');
            const [showConfirmModal, setShowConfirmModal] = React.useState(false);
            const [pendingBid, setPendingBid] = React.useState(0);
            const [showAllBidsModal, setShowAllBidsModal] = React.useState(false);

            const currentAuction = auctions.find(a => a.id === selectedAuctionId);

            const getCurrentHighest = (auc) => {
                if (!auc || !auc.bids || auc.bids.length === 0) return auc ? auc.startPrice : 0;
                return Math.max(...auc.bids.map(b => b.amount));
            };

            const getActiveViewersCount = (aucId) => {
                return presenceCounts[aucId] || 0;
            };

            React.useEffect(() => {
                if (currentAuction) {
                    const step = currentAuction.minBidStep || 100;
                    setBidAmountInput(String(step));
                    setActiveImageIndex(0);
                }
            }, [selectedAuctionId, currentAuction?.bids?.length]);

            React.useEffect(() => { 
                localStorage.setItem('iaukce_session', JSON.stringify(user)); 
            }, [user]);
            
            React.useEffect(() => { 
                localStorage.setItem('iaukce_auth', isAdmin); 
            }, [isAdmin]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                const targetPass = String.fromCharCode(64, 100, 109, 105, 110, 49);
                if (adminUser.trim() === 'Zvolanek1' && adminPassword === targetPass) {
                    setUser(null); setIsAdmin(true); setAdminLoginError(false); setView('admin'); setShowAuthMenu(false);
                } else { 
                    setAdminLoginError(true); 
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                if (!regForm.firstName || !regForm.lastName || !regForm.phone) {
                    alert('Prosím vyplňte všechna pole.'); return;
                }

                const existing = participants.find(p => p.phone.trim() === regForm.phone.trim());
                if (existing) {
                    alert('Účet s tímto telefonním číslem již v systému existuje!');
                    return;
                }

                const newUser = { 
                    id: String(Date.now()), 
                    first_name: regForm.firstName.trim(), 
                    last_name: regForm.lastName.trim(), 
                    phone: regForm.phone.trim(),
                    blocked: false
                };
                
                await supabase.from('participants').insert([newUser]);

                const clientUser = { id: newUser.id, firstName: newUser.first_name, lastName: newUser.last_name, phone: newUser.phone };
                setIsAdmin(false); 
                setUser(clientUser);
                await fetchData();
                setView('home');
            };

            const handleLoginExisting = (e) => {
                e.preventDefault();
                const found = participants.find(p => p.lastName.toLowerCase() === loginForm.lastName.trim().toLowerCase() && p.phone.trim() === loginForm.phone.trim());
                if (found) { 
                    if (found.blocked) {
                        alert('Tento účet byl zablokován administrátorem. Přihlášení není možné.');
                        return;
                    }
                    setIsAdmin(false); 
                    setUser(found); 
                    setView('home'); 
                    setShowAuthMenu(false); 
                } else { 
                    alert('Účastník s tímto příjmením a telefonním číslem nebyl nalezen.'); 
                }
            };

            const handleMultipleImagesUpload = (e, isEdit = false) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800;
                            let scale = 1;
                            if (img.width > MAX_WIDTH) { scale = MAX_WIDTH / img.width; }
                            canvas.width = img.width * scale;
                            canvas.height = img.height * scale;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const base64 = canvas.toDataURL('image/jpeg', 0.8);

                            if (isEdit) {
                                setEditForm(prev => ({...prev, imageUrls: [...(prev.imageUrls || []), base64]}));
                            } else {
                                setNewAuction(prev => ({...prev, imageUrls: [...(prev.imageUrls || []), base64]}));
                            }
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleRemoveImage = (index, isEdit = false) => {
                if (isEdit) {
                    setEditForm(prev => ({...prev, imageUrls: prev.imageUrls.filter((_, i) => i !== index)}));
                } else {
                    setNewAuction(prev => ({...prev, imageUrls: prev.imageUrls.filter((_, i) => i !== index)}));
                }
            };

            const handleCreateAuction = async (e) => {
                e.preventDefault();
                const startStr = `${newAuction.startDate}T${newAuction.startTime}`;
                const endStr = `${newAuction.endDate}T${newAuction.endTime}`;
                
                const createdDB = {
                    id: 'auc-' + Date.now(),
                    title: newAuction.title || 'iPhone Aukce',
                    product_name: newAuction.productName,
                    description: newAuction.description,
                    image_urls: newAuction.imageUrls || [],
                    price_label: newAuction.priceLabel || 'Aktuální cena',
                    starting_price: Number(newAuction.startPrice),
                    min_bid_step: Number(newAuction.minBidStep) || 100,
                    auto_extend_minutes: Number(newAuction.autoExtendMinutes) || 0,
                    start_time: new Date(startStr).toISOString(),
                    ends_at: new Date(endStr).toISOString(),
                    status: 'active',
                    bids: []
                };

                const { error } = await supabase.from('auctions').insert([createdDB]);
                if (error) {
                    alert('Chyba při publikování: ' + error.message);
                    return;
                }

                await fetchData();
                setSelectedAdminAuction(null);
            };

            const handleSaveEditAuction = async (e) => {
                e.preventDefault();
                const startStr = `${editForm.startDate}T${editForm.startTime}`;
                const endStr = `${editForm.endDate}T${editForm.endTime}`;
                
                const updateData = {
                    title: editForm.title,
                    product_name: editForm.productName,
                    description: editForm.description,
                    image_urls: editForm.imageUrls || [],
                    price_label: editForm.priceLabel || 'Aktuální cena',
                    starting_price: Number(editForm.startPrice),
                    min_bid_step: Number(editForm.minBidStep),
                    auto_extend_minutes: Number(editForm.autoExtendMinutes),
                    start_time: new Date(startStr).toISOString(),
                    ends_at: new Date(endStr).toISOString()
                };

                const { data, error } = await supabase.from('auctions').update(updateData).eq('id', editingAuctionId).select();
                if (error) {
                    alert('Chyba při úpravě: ' + error.message);
                    return;
                } else if (!data || data.length === 0) {
                    alert('Aukce se neaktualizovala! Pravděpodobně to blokuje RLS v Supabase.');
                }

                await fetchData();
                setEditingAuctionId(null);
            };

            const handleDeleteAuction = async (aucId) => {
                if (confirm('Opravdu chcete tuto aukci smazat?')) {
                    const { data, error } = await supabase.from('auctions').delete().eq('id', aucId).select();
                    if (error) {
                        alert('Chyba: ' + error.message);
                    } else if (!data || data.length === 0) {
                        alert('Aukce nebyla smazána! Zkontrolujte RLS (Row Level Security).');
                    }
                    await fetchData();
                    if (selectedAdminAuction && selectedAdminAuction.id === aucId) setSelectedAdminAuction(null);
                }
            };

            const handleDuplicateAuction = (auc) => {
                const sDate = new Date(auc.startTime);
                const eDate = new Date(auc.endTime);
                setNewAuction({
                    title: auc.title || 'iPhone Aukce',
                    productName: auc.productName + ' (Kopie)',
                    description: auc.description || '',
                    imageUrls: auc.imageUrls || [],
                    priceLabel: auc.priceLabel || 'Aktuální cena',
                    startPrice: auc.startPrice || 1000,
                    minBidStep: auc.minBidStep || 100,
                    autoExtendMinutes: auc.autoExtendMinutes || 2,
                    startDate: toYMD(sDate),
                    startTime: toHM(sDate),
                    endDate: toYMD(eDate),
                    endTime: toHM(eDate)
                });
                setSelectedAdminAuction('new');
            };

            const handleDeleteParticipant = async (partId) => {
                if (confirm('Opravdu chcete nenávratně smazat tohoto účastníka ze systému?')) {
                    const { data, error } = await supabase.from('participants').delete().eq('id', partId).select();
                    
                    if (error) {
                        alert('Chyba při mazání v databázi: ' + error.message);
                    } else if (!data || data.length === 0) {
                        alert('Účastník NEBYL smazán! Zkontrolujte RLS v Supabase.');
                    }
                    
                    await fetchData();
                }
            };

            const handleToggleBlockParticipant = async (partId, currentBlockedStatus) => {
                const newStatus = !currentBlockedStatus;

                const { data, error } = await supabase.from('participants').update({ blocked: newStatus }).eq('id', partId).select();
                
                if (error) {
                    alert('Chyba při změně blokování: ' + error.message);
                } else if (!data || data.length === 0) {
                    alert('Stav blokování NEBYL změněn! Zkontrolujte RLS v Supabase.');
                }
                
                await fetchData();
            };

            const handleSaveEditParticipant = async (e) => {
                e.preventDefault();
                const { data, error } = await supabase.from('participants').update({
                    first_name: partEditForm.firstName,
                    last_name: partEditForm.lastName,
                    phone: partEditForm.phone
                }).eq('id', editingPartId).select();

                if (error) {
                    alert('Chyba při úpravě účastníka: ' + error.message);
                    return;
                } else if (!data || data.length === 0) {
                    alert('Úprava nebyla uložena! Zkontrolujte RLS v Supabase.');
                }
                
                setEditingPartId(null);
                await fetchData();
            };

            const getAuctionStatus = (auc) => {
                if (auc.forceEnded) return 'ended';
                const start = new Date(auc.startTime).getTime();
                const end = new Date(auc.endTime).getTime();
                if (now < start) return 'scheduled';
                if (now >= start && now < end) return 'active';
                return 'ended';
            };

            const getDetailedTimeLeft = (targetTime) => {
                const diff = targetTime - now;
                if (diff <= 0) return 'Aukce skončila';
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const m = Math.floor((diff / 1000 / 60) % 60);
                const s = Math.floor((diff / 1000) % 60);
                return `${d > 0 ? d + ' dny ' : ''}${h}h ${m}m ${s}s`;
            };

            const confirmBid = async () => {
                if (!currentAuction) return;

                const currentStatus = getAuctionStatus(currentAuction);
                if (currentStatus !== 'active') {
                    alert('Do této aukce nyní nelze přihazovat (ještě nezačala nebo již skončila).');
                    setShowConfirmModal(false);
                    return;
                }

                let currentEndTime = new Date(currentAuction.endTime).getTime();
                if (currentAuction.autoExtendMinutes > 0) {
                    const extensionMs = currentAuction.autoExtendMinutes * 60 * 1000;
                    if (currentEndTime - now < extensionMs) {
                        currentEndTime = now + extensionMs;
                    }
                }

                const newBidObj = {
                    id: Date.now(),
                    firstName: user.firstName,
                    lastName: user.lastName,
                    phone: user.phone,
                    amount: pendingBid, 
                    time: new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                };

                const updatedBids = [newBidObj, ...(currentAuction.bids || [])];

                const { data, error } = await supabase.from('auctions').update({
                    ends_at: new Date(currentEndTime).toISOString(),
                    bids: updatedBids
                }).eq('id', selectedAuctionId).select();

                if (error) {
                    alert('Chyba při příhozu: ' + error.message);
                    return;
                } else if (!data || data.length === 0) {
                    alert('Příhoz se neuložil! Je nutné vypnout RLS u tabulky "auctions" v Supabase.');
                }

                await fetchData();
                setShowConfirmModal(false);
            };

            const getHighestBidder = (auc) => {
                if (!auc || !auc.bids || auc.bids.length === 0) return null;
                const sorted = [...auc.bids].sort((a,b) => b.amount - a.amount);
                return sorted[0];
            };

            const isUserWinning = (auc) => {
                if (!user || !auc || !auc.bids || auc.bids.length === 0) return false;
                const winning = getHighestBidder(auc);
                return winning && winning.phone === user.phone;
            };

            const currentHighestPrice = currentAuction ? getCurrentHighest(currentAuction) : 0;
            const aucStatus = currentAuction ? getAuctionStatus(currentAuction) : null;
            const isEnded = aucStatus === 'ended';
            const isScheduled = aucStatus === 'scheduled';
            const isActive = aucStatus === 'active';

            const handleSliderChange = (e) => {
                setBidAmountInput(e.target.value);
            };

            const numericBidInput = Number(bidAmountInput) || (currentAuction?.minBidStep || 100);
            let dynamicSliderMax = 20000;
            while (dynamicSliderMax <= numericBidInput) {
                dynamicSliderMax += 20000;
            }

            const IAukceLogo = () => (
                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => { setView('home'); setSelectedAuctionId(null); setSelectedAdminAuction(null); setEditingAuctionId(null); }}>
                    <div className="bg-blue-600 p-2 rounded-xl text-white shadow-md flex items-end justify-center gap-1 w-9 h-9">
                        <div className="w-1 bg-white rounded-full h-2"></div>
                        <div className="w-1 bg-white rounded-full h-3.5"></div>
                        <div className="w-1 bg-white rounded-full h-5"></div>
                    </div>
                    <div>
                        <span className="text-xl font-black tracking-tight text-slate-900">iAukce</span>
                        <span className="block text-[9px] text-slate-500 tracking-widest uppercase font-semibold">Soukromé aukce</span>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans antialiased pb-24 relative">
                    <header className="bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-40 px-4 py-2.5 flex items-center justify-between shadow-sm">
                        <IAukceLogo />

                        <div className="flex items-center gap-2 md:gap-3">
                            {isAdmin ? (
                                <div className="text-xs bg-indigo-50 px-3 py-1.5 rounded-full border border-indigo-200 text-slate-700">
                                    <span className="font-bold text-indigo-600">Admin Režim</span>
                                    <button onClick={() => { setIsAdmin(false); setView('home'); setSelectedAuctionId(null); }} className="ml-2 text-red-500 hover:underline font-medium">Odhlásit</button>
                                </div>
                            ) : user ? (
                                <div className="text-xs bg-blue-50 px-3 py-1.5 rounded-full border border-blue-200 text-slate-700">
                                    <span className="font-bold text-blue-600">{user.firstName}</span>

                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {showAllBidsModal && currentAuction && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-5 rounded-2xl max-w-sm w-full space-y-4 shadow-2xl max-h-[80vh] flex flex-col">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-slate-900 text-sm">Všechny příhozy ({currentAuction.bids.length})</h3>
                                    <button onClick={() => setShowAllBidsModal(false)} className="text-xs text-slate-500 font-bold">✕ Zavřít</button>
                                </div>
                                <div className="space-y-2 overflow-y-auto flex-1 pr-1">
                                    {currentAuction.bids.map((b, i) => (
                                        <div key={i} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl text-xs border border-slate-100">
                                            <div className="flex flex-col gap-0.5">
                                                <span className="font-bold text-slate-900">
                                                    {b.firstName}
                                                    {isAdmin && <span className="text-blue-600 ml-1">{b.lastName} ({b.phone})</span>}
                                                </span>
                                                <span className="text-[10px] text-slate-500">{b.time}</span>
                                            </div>
                                            <strong className="text-emerald-600 font-black text-sm whitespace-nowrap ml-2">{b.amount.toLocaleString()} Kč</strong>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {!footerVisible && (
                        <button
                            onClick={() => setFooterVisible(true)}
                            className="fixed bottom-0 right-4 z-40 bg-white/90 backdrop-blur border border-b-0 border-slate-200 text-slate-500 px-3 py-1.5 rounded-t-xl shadow-lg font-bold text-xs flex items-center gap-1 hover:text-slate-800 transition"
                        >
                            <span className="text-lg leading-none mt-[-2px]">↑</span> Info
                        </button>
                    )}

                    <div className={`fixed bottom-0 left-0 right-0 z-40 transition-transform duration-300 ${footerVisible ? 'translate-y-0' : 'translate-y-full'}`}>
                        <footer className="bg-white/95 backdrop-blur border-t border-slate-200 py-2.5 px-4 text-xs text-slate-600 shadow-[0_-4px_12px_rgba(0,0,0,0.08)]">
                            <div className="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2">
                                <div className="text-center md:text-left space-y-0.5">
                                    <p className="font-bold text-slate-700 text-[10px] md:text-xs">
                                        Upozornění: Přes tento web neprobíhají žádné platby. Web slouží výhradně pro kontaktování výherce.
                                    </p>
                                    <p className="text-slate-600 font-semibold text-[10px]">
                                        iAukce kontaktní osoba <span className="text-slate-900 font-bold">Zvolánek Denis</span> <a href="tel:+420602330228" className="text-blue-600 hover:underline font-bold">+420 602 330 228</a>
                                    </p>
                                </div>
                                
                                <button 
                                    onClick={() => setFooterVisible(false)}
                                    className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-3 py-1 rounded-lg transition shadow shrink-0"
                                >
                                    OK
                                </button>
                            </div>
                        </footer>
                    </div>

                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl animate-in zoom-in-95 duration-200">
                                <h3 className="font-bold text-slate-900 text-lg mb-1">
                                    Potvrdit navýšení o {(pendingBid - currentHighestPrice).toLocaleString()} Kč?
                                </h3>
                                <p className="text-xs text-slate-600 mb-5">
                                    Nová celková cena bude: <strong className="text-emerald-600 text-sm ml-1">{pendingBid.toLocaleString()} Kč</strong>
                                </p>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowConfirmModal(false)} className="flex-1 bg-slate-200 hover:bg-slate-300 py-2.5 rounded-xl font-bold text-xs transition">Zrušit</button>
                                    <button onClick={confirmBid} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-bold text-xs shadow transition">Potvrdit příhoz</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
